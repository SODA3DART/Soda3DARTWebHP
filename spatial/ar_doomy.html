<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <title>Fox AR</title>
</head>

<body>
    <a href="ar_character_hub.html"
        style="position: absolute; top: 20px; left: 20px; z-index: 1000; padding: 8px 20px; background: rgba(20, 20, 30, 0.6); color: white; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; text-decoration: none; font-family: sans-serif; backdrop-filter: blur(10px);">←
        一覧に戻る</a>
    <a-scene mindar-image="imageTargetSrc: ../3dartensyu3/ar/01/targets (2).mind;" color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="fox-motion" src="../3dartensyu3/ar/01/uetanikafe.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target">
            <a-entity gltf-model="#fox-motion" rotation="240 180 0" position="0 0 0" scale="0.3 0.3 0.3"
                animation-mixer="clip: *; loop: repeat;"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        const target = document.querySelector('#target');

        target.addEventListener("targetFound", event => {
            console.log("target found");
        });

        target.addEventListener("targetLost", event => {
            console.log("target lost");
        });
    </script>
</body>

</html>
