<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script>
        AFRAME.registerComponent('double-sided', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh') || this.el.object3D;
                    if (!obj) return;

                    obj.traverse((node) => {
                        if (!node.isMesh || !node.material) return;

                        const materials = Array.isArray(node.material) ? node.material : [node.material];
                        const nodeName = node.name.toLowerCase();

                        materials.forEach((mat) => {
                            if (!mat) return;
                            const matName = mat.name ? mat.name.toLowerCase() : '';

                            if (nodeName.includes('outline') || matName.includes('outline')) {
                                mat.side = THREE.FrontSide;
                                return;
                            }

                            mat.side = THREE.DoubleSide;
                            mat.transparent = false;
                            mat.opacity = 1;
                            mat.depthWrite = true;
                        });
                    });

                    this.el.emit('model-ready');
                });
            }
        });

        AFRAME.registerComponent('solid-wireframe', {
            schema: {
                enabled: { type: 'boolean', default: false },
                color: { type: 'color', default: '#111111' },
                thresholdAngle: { type: 'number', default: 15 }
            },
            init: function () {
                this.overlays = [];
                this.skinnedTargets = [];
                this.frameSkip = 0;
                this.onModelReady = () => {
                    requestAnimationFrame(() => this.applyMode());
                };
                this.el.addEventListener('model-ready', this.onModelReady);
                this.el.addEventListener('model-loaded', this.onModelReady);
            },
            isOutlineMesh: function (node) {
                const nodeName = node.name.toLowerCase();
                const materials = Array.isArray(node.material) ? node.material : [node.material];
                return materials.some((mat) => {
                    if (!mat || !mat.name) return false;
                    return nodeName.includes('outline') || mat.name.toLowerCase().includes('outline');
                });
            },
            removeOverlays: function () {
                this.overlays.forEach((entry) => {
                    entry.parent.remove(entry.line);
                    entry.line.geometry.dispose();
                    entry.line.material.dispose();
                });
                this.overlays = [];
                this.skinnedTargets = [];
            },
            rebuildOverlays: function () {
                this.removeOverlays();
                if (!this.data.enabled) return;

                const root = this.el.getObject3D('mesh') || this.el.object3D;
                if (!root) return;

                root.traverse((node) => {
                    if (!node.isMesh || !node.geometry || this.isOutlineMesh(node)) return;

                    const line = this.createOverlayLine(node);
                    node.add(line);
                    const entry = { parent: node, line: line };
                    this.overlays.push(entry);
                    if (node.isSkinnedMesh) this.skinnedTargets.push(entry);
                });
            },
            createOverlayLine: function (mesh) {
                const edges = new THREE.EdgesGeometry(mesh.geometry, this.data.thresholdAngle);
                const line = new THREE.LineSegments(
                    edges,
                    new THREE.LineBasicMaterial({
                        color: this.data.color,
                        depthTest: false,
                        depthWrite: false,
                        transparent: true,
                        opacity: 1
                    })
                );
                line.name = 'solid-wireframe-overlay';
                line.renderOrder = 999;
                line.frustumCulled = false;
                return line;
            },
            applyMode: function () {
                this.rebuildOverlays();
            },
            update: function (oldData) {
                if (oldData.enabled !== this.data.enabled ||
                    oldData.color !== this.data.color ||
                    oldData.thresholdAngle !== this.data.thresholdAngle) {
                    this.applyMode();
                }
            },
            remove: function () {
                this.removeOverlays();
                this.el.removeEventListener('model-ready', this.onModelReady);
                this.el.removeEventListener('model-loaded', this.onModelReady);
            }
        });
    </script>
    <title>たる吉 AR</title>
    <style>
        #marker-ui-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            padding: 8px 18px;
            background: rgba(20, 20, 30, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        #marker-ui-btn:hover {
            background: rgba(40, 40, 55, 0.9);
        }

        .marker-overlay {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
        }

        .marker-overlay.is-open {
            opacity: 1;
            visibility: visible;
        }

        .marker-panel {
            max-width: min(92vw, 440px);
            background: #1a1a24;
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            font-family: sans-serif;
            color: #eee;
        }

        .marker-panel h2 {
            margin: 0 0 10px 0;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .marker-panel p {
            margin: 0 0 12px 0;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #bbb;
        }

        .marker-panel img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            background: #fff;
        }

        .marker-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
            gap: 10px;
        }

        .marker-close {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .marker-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #mode-ui-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            padding: 8px 18px;
            background: rgba(20, 20, 30, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        #mode-ui-btn:hover {
            background: rgba(40, 40, 55, 0.9);
        }

        #view-ui-btn {
            position: fixed;
            bottom: 68px;
            right: 20px;
            z-index: 10000;
            padding: 8px 18px;
            background: rgba(20, 20, 30, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        #view-ui-btn:hover {
            background: rgba(40, 40, 55, 0.9);
        }
    </style>
</head>

<body>
    <a href="ar_character_hub.html"
        style="position: absolute; top: 20px; left: 20px; z-index: 1000; padding: 8px 20px; background: rgba(20, 20, 30, 0.6); color: white; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; text-decoration: none; font-family: sans-serif; backdrop-filter: blur(10px);">←
        一覧に戻る</a>
    <button type="button" id="marker-ui-btn" aria-expanded="false" aria-controls="marker-overlay">マーカーを表示</button>
    <button type="button" id="view-ui-btn" aria-pressed="false">ソリッドWF</button>
    <button type="button" id="mode-ui-btn" aria-pressed="false">ポスターモード</button>
    <audio id="bgm" src="../3dartensyu3/ar/08/BGM.mp3" preload="auto" loop playsinline></audio>
    <div id="marker-overlay" class="marker-overlay" role="dialog" aria-modal="true" aria-labelledby="marker-dialog-title" hidden>
        <div class="marker-panel">
            <h2 id="marker-dialog-title">たる吉 AR のマーカー</h2>
            <p>下の画像と同じものをカメラで映すと、ステージとキャラクターが表示されます。</p>
            <img src="../3dartensyu3/ar/08/たる吉.png" alt="たる吉 AR 用マーカー画像" />
            <div class="marker-actions">
                <button type="button" class="marker-close" id="marker-close-btn">閉じる</button>
            </div>
        </div>
    </div>
    <a-scene mindar-image="imageTargetSrc: ../3dartensyu3/ar/08/targets.mind;" color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.6" position="0 1 1"></a-light>
        <a-assets timeout="120000">
            <a-asset-item id="tarukichi" src="../3dartensyu3/ar/08/たる吉.glb"></a-asset-item>
            <a-asset-item id="stage" src="../3dartensyu3/ar/08/stage.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target">
            <a-entity id="stage-model" class="ar-model" gltf-model="#stage" rotation="90 0 0" position="0 -5 0" scale="1 1 1"
                animation-mixer="clip: *; loop: repeat;" double-sided></a-entity>
            <a-entity id="tarukichi-model" class="ar-model" gltf-model="#tarukichi" rotation="90 0 0" position="0 0 0.5" scale="1 1 1"
                animation-mixer="clip: *; loop: repeat;" double-sided solid-wireframe="enabled: false"></a-entity>
        </a-entity>
    </a-scene>
    <script>
        (function () {
            const MODE_ROTATION = {
                stand: '90 0 0',
                poster: '0 0 0'
            };
            const POSTER_Y_OFFSET = -0.45;
            const MODEL_LAYOUT = {
                'stage-model': { stand: [0, -0.18, 0] },
                'tarukichi-model': { stand: [0, 0, 0] }
            };

            const scene = document.querySelector('a-scene');
            const arModels = document.querySelectorAll('.ar-model');
            const tarukichiModel = document.querySelector('#tarukichi-model');
            const stageModel = document.querySelector('#stage-model');
            const audio = document.getElementById('bgm');

            if (tarukichiModel) {
                tarukichiModel.addEventListener('model-error', (e) => {
                    console.error('Tarukichi model failed to load:', e.detail);
                });
            }
            if (stageModel) {
                stageModel.addEventListener('model-error', (e) => {
                    console.error('Stage model failed to load:', e.detail);
                });
            }
            const modeBtn = document.getElementById('mode-ui-btn');
            const viewBtn = document.getElementById('view-ui-btn');
            let displayMode = 'stand';
            let wireframeEnabled = false;
            let audioUnlocked = false;
            let markerVisible = false;

            function applyDisplayMode() {
                arModels.forEach((el) => {
                    const layout = MODEL_LAYOUT[el.id];
                    if (!layout) return;

                    el.setAttribute('rotation', MODE_ROTATION[displayMode]);
                    const [x, y, z] = layout.stand;
                    const posY = displayMode === 'poster' ? y + POSTER_Y_OFFSET : y;
                    el.setAttribute('position', `${x} ${posY} ${z}`);
                });
                const isPoster = displayMode === 'poster';
                modeBtn.textContent = isPoster ? '立体モード' : 'ポスターモード';
                modeBtn.setAttribute('aria-pressed', isPoster ? 'true' : 'false');
            }

            modeBtn.addEventListener('click', () => {
                displayMode = displayMode === 'stand' ? 'poster' : 'stand';
                applyDisplayMode();
            });

            function setWireframeMode(enabled) {
                if (!tarukichiModel) return;
                tarukichiModel.setAttribute('solid-wireframe', { enabled: enabled });
                const wf = tarukichiModel.components['solid-wireframe'];
                if (wf) wf.applyMode();
            }

            viewBtn.addEventListener('click', () => {
                wireframeEnabled = !wireframeEnabled;
                setWireframeMode(wireframeEnabled);
                viewBtn.textContent = wireframeEnabled ? '通常表示' : 'ソリッドWF';
                viewBtn.setAttribute('aria-pressed', wireframeEnabled ? 'true' : 'false');
            });

            async function unlockAudio() {
                if (audioUnlocked || !audio) return;
                try {
                    audio.muted = true;
                    await audio.play();
                    audio.pause();
                    audio.currentTime = 0;
                    audio.muted = false;
                    audioUnlocked = true;
                    if (markerVisible) await playBgm();
                } catch (err) {
                    console.warn('Audio unlock failed:', err);
                }
            }

            async function playBgm() {
                if (!audio) return;
                if (!audioUnlocked) {
                    await unlockAudio();
                    if (!audioUnlocked) return;
                }
                try {
                    if (audio.paused) await audio.play();
                } catch (err) {
                    console.warn('BGM play failed:', err);
                }
            }

            function pauseBgm() {
                if (!audio) return;
                audio.pause();
                audio.currentTime = 0;
            }

            function setupMarkerAudio() {
                const target = document.querySelector('#target');
                if (!target) return;

                target.addEventListener('targetFound', () => {
                    markerVisible = true;
                    playBgm();
                });

                target.addEventListener('targetLost', () => {
                    markerVisible = false;
                    pauseBgm();
                });
            }

            ['click', 'touchstart'].forEach((evt) => {
                document.body.addEventListener(evt, unlockAudio, { passive: true });
            });

            if (scene) {
                if (scene.hasLoaded) {
                    setupMarkerAudio();
                } else {
                    scene.addEventListener('loaded', setupMarkerAudio);
                }
            }

            applyDisplayMode();
            if (scene) {
                scene.addEventListener('loaded', applyDisplayMode);
            }

            const btn = document.getElementById('marker-ui-btn');
            const overlay = document.getElementById('marker-overlay');
            const closeBtn = document.getElementById('marker-close-btn');
            function openOverlay() {
                overlay.hidden = false;
                overlay.classList.add('is-open');
                btn.setAttribute('aria-expanded', 'true');
            }
            function closeOverlay() {
                overlay.classList.remove('is-open');
                btn.setAttribute('aria-expanded', 'false');
                overlay.hidden = true;
            }
            btn.addEventListener('click', () => openOverlay());
            closeBtn.addEventListener('click', () => closeOverlay());
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeOverlay();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeOverlay();
            });
        })();
    </script>
    <link rel="stylesheet" href="ar-howto.css">
    <script src="ar-howto.js"></script>
</body>

</html>
