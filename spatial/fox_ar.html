<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <title>Fox AR</title>
    <style>
        #marker-ui-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            padding: 8px 18px;
            background: rgba(20, 20, 30, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        #marker-ui-btn:hover {
            background: rgba(40, 40, 55, 0.9);
        }

        .marker-overlay {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
        }

        .marker-overlay.is-open {
            opacity: 1;
            visibility: visible;
        }

        .marker-panel {
            max-width: min(92vw, 440px);
            background: #1a1a24;
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            font-family: sans-serif;
            color: #eee;
        }

        .marker-panel h2 {
            margin: 0 0 10px 0;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .marker-panel p {
            margin: 0 0 12px 0;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #bbb;
        }

        .marker-panel img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            background: #fff;
        }

        .marker-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
            gap: 10px;
        }

        .marker-close {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .marker-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #mode-ui-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            padding: 8px 18px;
            background: rgba(20, 20, 30, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        #mode-ui-btn:hover {
            background: rgba(40, 40, 55, 0.9);
        }
    </style>
</head>

<body>
    <a href="ar_character_hub.html"
        style="position: absolute; top: 20px; left: 20px; z-index: 1000; padding: 8px 20px; background: rgba(20, 20, 30, 0.6); color: white; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; text-decoration: none; font-family: sans-serif; backdrop-filter: blur(10px);">←
        一覧に戻る</a>
    <button type="button" id="marker-ui-btn" aria-expanded="false" aria-controls="marker-overlay">マーカーを表示</button>
    <button type="button" id="mode-ui-btn" aria-pressed="false">ポスターモード</button>
    <div id="marker-overlay" class="marker-overlay" role="dialog" aria-modal="true" aria-labelledby="marker-dialog-title" hidden>
        <div class="marker-panel">
            <h2 id="marker-dialog-title">Fox AR のマーカー</h2>
            <p>下の画像と同じものをカメラで映すと、キャラクターが表示されます。</p>
            <img src="../3dartensyu3/ar/03/ロゴ.jpg" alt="Fox AR 用マーカー画像" />
            <div class="marker-actions">
                <button type="button" class="marker-close" id="marker-close-btn">閉じる</button>
            </div>
        </div>
    </div>
    <a-scene mindar-image="imageTargetSrc: ../3dartensyu3/ar/03/ロゴ target.mind;" color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="fox-motion" src="../3dartensyu3/ar/03/fox._motion.glb"></a-asset-item>
            <a-asset-item id="fox-behind" src="../3dartensyu3/ar/03/fox._bhindglb.glb"></a-asset-item>
            <audio id="bgm" src="../3dartensyu3/ar/03/プラネット・ブレイク.mp3" preload="auto"></audio>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target">
            <a-entity class="ar-model" gltf-model="#fox-motion" rotation="240 180 0" position="0 0 0" scale="0.3 0.3 0.3"
                animation-mixer="clip: *; loop: repeat;"></a-entity>
            <a-entity class="ar-model" gltf-model="#fox-behind" rotation="240 180 0" position="0 0.2 0" scale="0.3 0.3 0.3"
                animation-mixer="clip: *; loop: repeat;"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        (function () {
            const MODE_ROTATION = {
                stand: '240 180 0',
                poster: '150 180 0'
            };
            const POSTER_Y_OFFSET = -0.45;

            function getPositionString(el) {
                const pos = el.getAttribute('position');
                if (!pos) return '0 0 0';
                if (typeof pos === 'string') return pos;
                return `${pos.x || 0} ${pos.y || 0} ${pos.z || 0}`;
            }

            function parsePositionString(str) {
                const parts = String(str || '0 0 0').trim().split(/\s+/).map(Number);
                return [
                    Number.isFinite(parts[0]) ? parts[0] : 0,
                    Number.isFinite(parts[1]) ? parts[1] : 0,
                    Number.isFinite(parts[2]) ? parts[2] : 0
                ];
            }

            const target = document.querySelector('#target');
            const audio = document.querySelector('#bgm');
            const modeBtn = document.getElementById('mode-ui-btn');
            const arModels = document.querySelectorAll('.ar-model');
            let displayMode = 'stand';

            arModels.forEach((el) => {
                el.dataset.standPosition = getPositionString(el);
            });

            function applyDisplayMode() {
                arModels.forEach((el) => {
                    el.setAttribute('rotation', MODE_ROTATION[displayMode]);
                    const parts = parsePositionString(el.dataset.standPosition);
                    if (displayMode === 'poster') {
                        el.setAttribute('position', `${parts[0]} ${parts[1] + POSTER_Y_OFFSET} ${parts[2]}`);
                    } else {
                        el.setAttribute('position', `${parts[0]} ${parts[1]} ${parts[2]}`);
                    }
                });
                const isPoster = displayMode === 'poster';
                modeBtn.textContent = isPoster ? '立体モード' : 'ポスターモード';
                modeBtn.setAttribute('aria-pressed', isPoster ? 'true' : 'false');
            }

            modeBtn.addEventListener('click', () => {
                displayMode = displayMode === 'stand' ? 'poster' : 'stand';
                applyDisplayMode();
            });

            applyDisplayMode();

            target.addEventListener('targetFound', () => {
                console.log('target found');
                if (audio) audio.play().catch(() => {});
            });

            target.addEventListener('targetLost', () => {
                console.log('target lost');
                if (audio) {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });

            const btn = document.getElementById('marker-ui-btn');
            const overlay = document.getElementById('marker-overlay');
            const closeBtn = document.getElementById('marker-close-btn');
            function openOverlay() {
                overlay.hidden = false;
                overlay.classList.add('is-open');
                btn.setAttribute('aria-expanded', 'true');
            }
            function closeOverlay() {
                overlay.classList.remove('is-open');
                btn.setAttribute('aria-expanded', 'false');
                overlay.hidden = true;
            }
            btn.addEventListener('click', () => openOverlay());
            closeBtn.addEventListener('click', () => closeOverlay());
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeOverlay();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeOverlay();
            });
        })();
    </script>
</body>

</html>
