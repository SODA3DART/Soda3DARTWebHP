<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script>
        AFRAME.registerComponent('double-sided', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh');
                    if (obj) {
                        obj.traverse((node) => {
                            if (node.isMesh) {
                                // Check if the mesh is an outline
                                const nodeName = node.name.toLowerCase();
                                const matName = node.material.name ? node.material.name.toLowerCase() : '';
                                if (nodeName.includes('outline') || matName.includes('outline')) {
                                    // Skip double-sided for outlines to avoid occlusion
                                    console.log('Skipping double-sided for outline:', node.name);
                                } else {
                                    node.material.side = THREE.DoubleSide;
                                }
                            }
                        });
                    }
                });
            }
        });
    </script>
    <title>Yui AR</title>
</head>

<body>
    <a href="ar_character_hub.html"
        style="position: absolute; top: 20px; left: 20px; z-index: 1000; padding: 8px 20px; background: rgba(20, 20, 30, 0.6); color: white; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; text-decoration: none; font-family: sans-serif; backdrop-filter: blur(10px);">←
        一覧に戻る</a>
    <a-scene mindar-image="imageTargetSrc: ../3dartensyu3/ar/02/targets.mind;" color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        <a-assets>
            <a-asset-item id="yui" src="../3dartensyu3/ar/02/hunatubayui.glb"></a-asset-item>
            <a-asset-item id="haikei-bg" src="../3dartensyu3/ar/02/haikei.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-entity gltf-model="#yui" rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5"
                animation-mixer="clip: *; loop: repeat;" double-sided></a-entity>
            <a-entity gltf-model="#haikei-bg" rotation="0 0 0" position="0 0 0" scale="0.5 0.5 0.5"
                animation-mixer="clip: *; loop: repeat;"></a-entity>
        </a-entity>
    </a-scene>
</body>

</html>
