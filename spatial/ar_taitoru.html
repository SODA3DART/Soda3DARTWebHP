<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Taitoru | Soda3DART</title>
    <!-- MindAR and A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #00f2ff;
            --secondary-color: #ff0055;
            --bg-glass: rgba(20, 20, 30, 0.6);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Loading Screen */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
            pointer-events: auto;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Scanning Overlay */
        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 70vw;
            max-width: 400px;
            max-height: 400px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            overflow: hidden;
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
            position: absolute;
            top: 0;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* Header */
        header {
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
            text-align: center;
            pointer-events: auto;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-color);
        }

        /* Footer / Controls */
        footer {
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            text-align: center;
            pointer-events: auto;
        }

        .status-pill {
            display: inline-block;
            padding: 8px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .instruction {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 20px;
            backdrop-filter: blur(10px);
            font-size: 0.85rem;
            text-align: center;
        }

        #marker-ui-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 8px 18px;
            background: var(--bg-glass);
            color: #fff;
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        #marker-ui-btn:hover {
            border-color: rgba(0, 242, 255, 0.4);
            color: var(--primary-color);
        }

        .marker-overlay {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
            pointer-events: auto;
        }

        .marker-overlay.is-open {
            opacity: 1;
            visibility: visible;
        }

        .marker-panel {
            max-width: min(92vw, 440px);
            background: rgba(20, 20, 30, 0.95);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid var(--border-glass);
            font-family: 'Outfit', sans-serif;
            color: #eee;
        }

        .marker-panel h2 {
            margin: 0 0 10px 0;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .marker-panel p {
            margin: 0 0 12px 0;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #bbb;
        }

        .marker-panel img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            background: #fff;
        }

        .marker-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
            gap: 10px;
        }

        .marker-close {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 0.9rem;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
        }

        .marker-close:hover {
            background: rgba(0, 242, 255, 0.2);
            color: var(--primary-color);
        }
    </style>
</head>

<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <p>ARシステムを初期化中...</p>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <a href="ar_character_hub.html"
            style="position: absolute; top: 20px; left: 20px; z-index: 1000; padding: 8px 20px; background: rgba(20, 20, 30, 0.6); color: white; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; text-decoration: none; font-family: 'Outfit', sans-serif; backdrop-filter: blur(10px); pointer-events: auto;">←
            一覧に戻る</a>
        <button type="button" id="marker-ui-btn" aria-expanded="false" aria-controls="marker-overlay">マーカーを表示</button>
        <header>
            <h1>AR Taitoru</h1>
        </header>

        <div class="scan-frame">
            <div class="scan-line"></div>
        </div>

        <footer>
            <div class="instruction">
                taitoru.jpgをカメラで読み込んでください
            </div>
            <div id="status-text" class="status-pill">マーカーをスキャン中...</div>
        </footer>
    </div>

    <div id="marker-overlay" class="marker-overlay" role="dialog" aria-modal="true" aria-labelledby="marker-dialog-title" hidden>
        <div class="marker-panel">
            <h2 id="marker-dialog-title">AR Taitoru のマーカー</h2>
            <p>下の画像（taitoru.jpg）と同じものをカメラで映すと、モデルが表示されます。</p>
            <img src="../3dartensyu3/ar/01/taitoru.jpg" alt="AR Taitoru 用マーカー画像" />
            <div class="marker-actions">
                <button type="button" class="marker-close" id="marker-close-btn">閉じる</button>
            </div>
        </div>
    </div>

    <!-- AR Scene -->
    <!-- targets4.mindを使用してtaitoru.jpgを認識し、ue.glbモデルを表示 -->
    <a-scene
        mindar-image="imageTargetSrc: ../3dartensyu3/ar/01/targets%20(2).mind; uiLoading: no; uiError: no; uiScanning: no;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- 3Dモデルアセット -->
            <!-- 3Dモデルアセット -->
            <a-asset-item id="ue-model" src="../3dartensyu3/ar/01/uetanikafe.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- ターゲットエンティティ (targets4.mindの最初のターゲット = taitoru.jpg) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- 3Dモデルを表示 -->
            <a-gltf-model src="#ue-model" position="0 0 0" rotation="0 0 0" scale="3 3 3"
                animation="property: position; to: 0 0.1 0; dir: alternate; dur: 2000; loop: true">
            </a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const scene = document.querySelector('a-scene');
            const loadingScreen = document.getElementById('loading-screen');
            const statusText = document.getElementById('status-text');
            const targetEntity = document.querySelector('a-entity[mindar-image-target]');

            // ARシステムの準備完了
            scene.addEventListener('arReady', () => {
                loadingScreen.classList.add('hidden');
                statusText.textContent = 'マーカーをスキャン中...';
            });

            // エラーハンドリング
            scene.addEventListener('arError', (event) => {
                statusText.textContent = 'AR初期化エラー';
                console.error('AR Error:', event);
            });

            // ターゲット検出イベント
            if (targetEntity) {
                targetEntity.addEventListener('targetFound', () => {
                    statusText.textContent = 'マーカーを検出しました！';
                    statusText.style.borderColor = '#00f2ff';
                    statusText.style.color = '#00f2ff';
                });

                targetEntity.addEventListener('targetLost', () => {
                    statusText.textContent = 'マーカーをスキャン中...';
                    statusText.style.borderColor = 'rgba(255,255,255,0.1)';
                    statusText.style.color = 'white';
                });
            }

            const markerBtn = document.getElementById('marker-ui-btn');
            const markerOverlay = document.getElementById('marker-overlay');
            const markerCloseBtn = document.getElementById('marker-close-btn');
            if (markerBtn && markerOverlay && markerCloseBtn) {
                function openMarkerOverlay() {
                    markerOverlay.hidden = false;
                    markerOverlay.classList.add('is-open');
                    markerBtn.setAttribute('aria-expanded', 'true');
                }
                function closeMarkerOverlay() {
                    markerOverlay.classList.remove('is-open');
                    markerBtn.setAttribute('aria-expanded', 'false');
                    markerOverlay.hidden = true;
                }
                markerBtn.addEventListener('click', () => openMarkerOverlay());
                markerCloseBtn.addEventListener('click', () => closeMarkerOverlay());
                markerOverlay.addEventListener('click', (e) => {
                    if (e.target === markerOverlay) closeMarkerOverlay();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && markerOverlay.classList.contains('is-open')) closeMarkerOverlay();
                });
            }
        });
    </script>
</body>

</html>
