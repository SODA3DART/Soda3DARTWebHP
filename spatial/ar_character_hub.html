<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飛び出すARキャラクター | Soda3DART</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --primary-accent: #00c6ff;
            --secondary-accent: #0072ff;
            --bg-color: #f8f9fa;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(0, 198, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 114, 255, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Zen Kaku Gothic New', 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow: hidden;
        }

        #root {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Responsive Styles */
        .header-container {
            text-align: center;
            padding: 30px 20px;
            z-index: 10;
            position: relative;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin: 0 0 25px 0;
            letter-spacing: 0.05em;
            text-shadow: 0 10px 20px rgba(0, 198, 255, 0.15);
        }

        .description-card {
            max-width: 640px;
            width: 100%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 24px 32px;
            box-sizing: border-box;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            text-align: left;
        }

        .description-text {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-main);
            margin: 0;
            font-weight: 500;
        }

        .sub-text {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .carousel-wrapper {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 0;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .card-container {
            position: absolute;
            width: 280px;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: var(--shadow-hover);
            text-align: center;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .header-container {
                padding: 15px 15px 5px;
            }

            .header-title {
                font-size: 1.6rem;
                margin: 0 0 15px 0;
            }

            .description-card {
                padding: 15px 20px;
                border-radius: 20px;
            }

            .description-text {
                font-size: 0.85rem;
                line-height: 1.5;
            }

            /* Adjust sub-text to be more compact or ensure it doesn't break layout */
            .sub-text {
                font-size: 0.8rem;
                margin-top: 8px;
            }

            .card-container {
                width: 240px;
                padding: 20px;
            }

            /* Ensure arrows don't overlap content too aggressively */
            .nav-arrow {
                width: 36px;
                height: 36px;
                background: rgba(255, 255, 255, 0.9);
            }
        }

        /* Make sure small phones don't break */
        @media (max-height: 700px) {
            .header-container {
                padding: 10px 15px;
            }

            .header-title {
                font-size: 1.4rem;
                margin-bottom: 10px;
            }

            .description-card {
                padding: 12px 16px;
                max-height: 200px;
                overflow-y: auto;
            }

            .description-text {
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Data for AR Projects
        const projects = [
            { id: 1, title: "Doomy", link: "ar_doomy.html", image: "../3dartensyu3/ar/01/doom.jpg", desc: "" },
            { id: 2, title: "Fox", link: "fox_ar.html", image: "../3dartensyu3/ar/03/ロゴ.jpg", desc: "" },
            { id: 3, title: "肥後 椿", link: "higotubaki_ar.html", image: "../3dartensyu3/ar/05/肥後椿マーカー画像.png", desc: "" },
            { id: 4, title: "そらっぺ", link: "sorappe_ar.html", image: "../3dartensyu3/ar/04/poster.png", desc: "" },
            { id: 5, title: "ひなつば ゆい", link: "yui_ar.html", image: "../3dartensyu3/ar/02/ポスター.png", desc: "" },
            { id: 6, title: "Leo", link: "ar_leo.html", image: "../3dartensyu3/ar/06/marker.png", desc: "" },
            { id: 7, title: "飛雄・八枝郎", link: "ar_tobio.html", image: "../3dartensyu3/ar/07/poster.png", desc: "" },
            { id: 8, title: "たる吉", link: "ar_tarukichi.html", image: "../3dartensyu3/ar/08/たる吉.png", desc: "" },
            { id: 9, title: "刀奈権", link: "ar_katanagonn.html", image: "../3dartensyu3/ar/09/motihuirasuto.png", desc: "" },
            { id: 10, title: "みく御成ちゃん", link: "ar_mikugyosei.html", image: "../3dartensyu3/ar/10/みく御成ちゃん画像.png", desc: "" }
        ];

        const Header = () => (
            <header className="header-container">
                <h1 className="header-title">
                    飛び出す!ARキャラクター
                </h1>

                <div className="description-card">
                    <div style={{ display: 'flex', alignItems: 'center', marginBottom: '8px' }}>
                        <span style={{
                            display: 'inline-block',
                            width: '4px',
                            height: '1.2em',
                            background: 'var(--primary-accent)',
                            marginRight: '10px',
                            borderRadius: '2px'
                        }}></span>
                        <span style={{ fontWeight: '700', color: 'var(--secondary-accent)', fontSize: '0.8rem', letterSpacing: '0.1em' }}>ABOUT CONCEPT</span>
                    </div>
                    <p className="description-text">
                        3年生による『飛び出す!ARキャラクター』のページです。<br />
                        実在のランドマークを基にキャラクターデザインからモデリングまで行い、スマートフォンで動くことができる形で制作しました。
                        <span className="sub-text">
                            ゲームデザインの一環としてスマートフォンで動かすために様々な制約がある中で、形状の記号化や様々なテクニックを駆使して、各自のデザイン具現化を行いました。
                        </span>
                    </p>
                </div>
            </header>
        );

        const Carousel = () => {
            const [activeIndex, setActiveIndex] = useState(0);
            const [isDragging, setIsDragging] = useState(false);
            const [startX, setStartX] = useState(0);
            const [dragOffset, setDragOffset] = useState(0);
            const containerRef = useRef(null);

            const getWrappedIndex = (index) => {
                const len = projects.length;
                return ((index % len) + len) % len;
            };

            const handleDragStart = (e) => {
                setIsDragging(true);
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                setStartX(clientX);
            };

            const handleDragMove = (e) => {
                if (!isDragging) return;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const offset = clientX - startX;
                setDragOffset(offset);
            };

            const handleDragEnd = () => {
                setIsDragging(false);
                const threshold = 50;
                if (dragOffset > threshold) {
                    setActiveIndex((prev) => getWrappedIndex(prev - 1));
                } else if (dragOffset < -threshold) {
                    setActiveIndex((prev) => getWrappedIndex(prev + 1));
                }
                setDragOffset(0);
            };

            const goNext = () => setActiveIndex((prev) => getWrappedIndex(prev + 1));
            const goPrev = () => setActiveIndex((prev) => getWrappedIndex(prev - 1));

            return (
                <div className="carousel-wrapper">

                    {/* Navigation Arrows */}
                    <div className="nav-arrow" onClick={goPrev} style={{ left: '10px' }}>
                        ◀
                    </div>
                    <div className="nav-arrow" onClick={goNext} style={{ right: '10px' }}>
                        ▶
                    </div>

                    <div
                        ref={containerRef}
                        style={{
                            flexGrow: 1,
                            position: 'relative',
                            overflow: 'hidden',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            width: '100%',
                            cursor: isDragging ? 'grabbing' : 'grab',
                            touchAction: 'none'
                        }}
                        onMouseDown={handleDragStart}
                        onMouseMove={handleDragMove}
                        onMouseUp={handleDragEnd}
                        onMouseLeave={handleDragEnd}
                        onTouchStart={handleDragStart}
                        onTouchMove={handleDragMove}
                        onTouchEnd={handleDragEnd}
                    >
                        {projects.map((project, index) => {
                            const len = projects.length;
                            let offset = index - activeIndex;

                            if (offset > len / 2) offset -= len;
                            if (offset < -len / 2) offset += len;

                            const dragShift = dragOffset / 300;
                            const effectiveOffset = offset + dragShift;
                            const isActive = Math.round(effectiveOffset) === 0;

                            const distance = Math.abs(effectiveOffset);
                            const scale = Math.max(0.75, 1 - distance * 0.15);
                            const opacity = Math.max(0.5, 1 - distance * 0.3);
                            const zIndex = 100 - Math.round(distance * 10);

                            const x = effectiveOffset * 65;
                            const display = distance > 2.5 ? 'none' : 'block';

                            return (
                                <div key={project.id} className="card-container" style={{
                                    transition: isDragging ? 'none' : 'all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)',
                                    transform: `translateX(${x}%) scale(${scale})`,
                                    opacity: opacity,
                                    zIndex: zIndex,
                                    display: display,
                                    pointerEvents: isActive ? 'auto' : 'none',
                                    border: isActive ? `2px solid var(--primary-accent)` : '1px solid transparent'
                                }}>
                                    <div style={{
                                        width: '120px',
                                        height: '120px',
                                        borderRadius: '50%',
                                        margin: '0 auto 15px',
                                        overflow: 'hidden',
                                        border: '4px solid #f0f0f0',
                                        boxShadow: '0 5px 15px rgba(0,0,0,0.1)'
                                    }}>
                                        <img src={project.image} alt={project.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                                    </div>
                                    <h3 style={{ margin: '0 0 8px 0', fontSize: '1.2rem' }}>{project.title}</h3>
                                    <p style={{ color: 'var(--text-sub)', fontSize: '0.85rem', marginBottom: '15px', minHeight: '2.5em' }}>{project.desc}</p>
                                    <a href={project.link} style={{
                                        display: 'inline-block',
                                        padding: '10px 25px',
                                        background: 'linear-gradient(135deg, var(--secondary-accent), var(--primary-accent))',
                                        color: 'white',
                                        textDecoration: 'none',
                                        borderRadius: '50px',
                                        fontWeight: '600',
                                        opacity: isActive ? 1 : 0,
                                        transform: isActive ? 'scale(1)' : 'scale(0.8)',
                                        transition: 'opacity 0.3s, transform 0.3s',
                                        fontSize: '0.9rem'
                                    }}>
                                        ARを見る
                                    </a>
                                </div>
                            );
                        })}
                    </div>

                    {/* Bottom Slider/Dots */}
                    <div style={{
                        textAlign: 'center',
                        padding: '15px',
                        display: 'flex',
                        justifyContent: 'center',
                        gap: '8px',
                        zIndex: 200,
                        flexShrink: 0
                    }}>
                        {projects.map((_, idx) => (
                            <div
                                key={idx}
                                onClick={() => setActiveIndex(idx)}
                                style={{
                                    width: activeIndex === idx ? '24px' : '8px',
                                    height: '8px',
                                    borderRadius: '4px',
                                    background: activeIndex === idx ? 'var(--primary-accent)' : 'rgba(0,0,0,0.2)',
                                    transition: 'all 0.3s',
                                    cursor: 'pointer'
                                }}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            return (
                <div style={{ height: '100vh', display: 'flex', flexDirection: 'column' }}>
                    <Header />
                    <Carousel />
                    <footer style={{
                        textAlign: 'center',
                        padding: '10px',
                        color: 'var(--text-sub)',
                        fontSize: '0.75rem',
                        opacity: 0.7,
                        flexShrink: 0
                    }}>
                        &copy; Soda3DART Class Project
                    </footer>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
