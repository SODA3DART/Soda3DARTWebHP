<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飛び出すARキャラクター | Soda3DART</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --primary-accent: #00c6ff;
            --secondary-accent: #0072ff;
            --bg-color: #f8f9fa;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(0, 198, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 114, 255, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Zen Kaku Gothic New', 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #root {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hub-title-wrap {
            text-align: center;
            padding: 30px 20px 0;
            flex-shrink: 0;
        }

        .hub-info-section {
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .hub-carousel-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .carousel-section-label {
            display: none;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin: 0 0 25px 0;
            letter-spacing: 0.05em;
            text-shadow: 0 10px 20px rgba(0, 198, 255, 0.15);
        }

        .description-card {
            max-width: 640px;
            width: 100%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 24px 32px;
            box-sizing: border-box;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            text-align: left;
        }

        .guide-toggle.is-collapsed {
            padding: 12px 18px;
            border: 2px solid rgba(0, 114, 255, 0.35);
            animation: guidePulse 2.4s ease-in-out infinite;
        }

        .guide-toggle.is-open {
            padding: 20px 24px 24px;
            animation: none;
        }

        @keyframes guidePulse {
            0%, 100% {
                border-color: rgba(0, 114, 255, 0.35);
                box-shadow: 0 4px 18px rgba(0, 114, 255, 0.12), 0 0 0 0 rgba(0, 198, 255, 0);
            }
            50% {
                border-color: rgba(0, 198, 255, 0.85);
                box-shadow: 0 6px 24px rgba(0, 114, 255, 0.22), 0 0 0 5px rgba(0, 198, 255, 0.18);
            }
        }

        @keyframes guideBarPulse {
            0%, 100% { background: var(--primary-accent); }
            50% { background: var(--secondary-accent); }
        }

        .guide-toggle.is-collapsed .section-label-bar {
            animation: guideBarPulse 2.4s ease-in-out infinite;
        }

        .guide-toggle-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
        }

        .guide-toggle-header .section-label {
            flex: 1;
            margin-bottom: 0;
        }

        .guide-toggle-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .guide-toggle-hint {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--secondary-accent);
            white-space: nowrap;
        }

        .guide-toggle-chevron {
            font-size: 0.7rem;
            color: var(--secondary-accent);
            transition: transform 0.3s ease;
        }

        .guide-toggle.is-open .guide-toggle-chevron {
            transform: rotate(180deg);
        }

        .guide-toggle-body {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
            margin-top: 0;
        }

        .guide-toggle-body.is-visible {
            max-height: 520px;
            opacity: 1;
            margin-top: 14px;
        }

        .description-text {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-main);
            margin: 0;
            font-weight: 500;
        }

        .sub-text {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .section-label {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .section-label-bar {
            display: inline-block;
            width: 4px;
            height: 1.2em;
            background: var(--primary-accent);
            margin-right: 10px;
            border-radius: 2px;
        }

        .section-label-text {
            font-weight: 700;
            color: var(--secondary-accent);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
        }

        .guide-steps {
            margin: 14px 0 0;
            padding-left: 1.2em;
            font-size: 0.92rem;
            line-height: 1.65;
        }

        .guide-steps li {
            margin-bottom: 8px;
        }

        .guide-steps li:last-child {
            margin-bottom: 0;
        }

        .print-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            padding: 12px 18px;
            min-height: 44px;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(0, 114, 255, 0.25);
            -webkit-tap-highlight-color: transparent;
        }

        .print-link-btn:hover {
            opacity: 0.92;
        }

        .concept-card {
            padding: 18px 24px;
            margin-bottom: 12px;
            text-align: left;
        }

        .concept-card .section-label {
            margin-bottom: 10px;
        }

        .concept-note {
            margin: 0;
            font-size: 0.88rem;
            color: var(--text-main);
            line-height: 1.75;
            font-weight: 500;
        }

        .gallery-back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 300;
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.85);
            color: #0072ff;
            border: 1px solid rgba(0, 114, 255, 0.2);
            border-radius: 50px;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 16px rgba(0, 114, 255, 0.12);
        }

        .gallery-back-link:hover {
            background: #fff;
        }

        .carousel-wrapper {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 0;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-arrow-prev {
            left: 10px;
        }

        .nav-arrow-next {
            right: 10px;
        }

        .card-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280px;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: var(--shadow-hover);
            text-align: center;
        }

        .carousel-track {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 380px;
            touch-action: pan-y;
        }

        .card-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 15px;
            overflow: hidden;
            border: 4px solid #f0f0f0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
        }

        .card-desc {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 15px;
            min-height: 2.5em;
        }

        .card-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 10px 25px;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.3s, transform 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .card-cta.is-active {
            opacity: 1;
            transform: scale(1);
        }

        .card-cta.is-inactive {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        .carousel-dots {
            text-align: center;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 200;
            flex-shrink: 0;
        }

        .carousel-dot {
            height: 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            padding: 0;
            min-width: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .carousel-dot.is-active {
            width: 24px;
            background: var(--primary-accent);
        }

        .carousel-dot:not(.is-active) {
            width: 8px;
        }

        .hub-footer {
            text-align: center;
            padding: 10px;
            color: var(--text-sub);
            font-size: 0.75rem;
            opacity: 0.7;
            flex-shrink: 0;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                padding-bottom: env(safe-area-inset-bottom, 0);
            }

            .app-shell {
                min-height: 100dvh;
                height: auto;
            }

            .gallery-back-link {
                top: max(12px, env(safe-area-inset-top, 12px));
                left: max(10px, env(safe-area-inset-left, 10px));
                padding: 8px 12px;
                font-size: 0.75rem;
                max-width: 38vw;
            }

            .howto-hub-btn {
                top: max(12px, env(safe-area-inset-top, 12px));
                right: max(10px, env(safe-area-inset-right, 10px));
            }

            .hub-title-wrap {
                padding: calc(52px + env(safe-area-inset-top, 0px)) 14px 8px;
                order: 1;
            }

            .header-title {
                font-size: 1.25rem;
                margin: 0;
                line-height: 1.35;
                letter-spacing: 0.02em;
            }

            .hub-info-section {
                padding: 0 14px 16px;
                order: 3;
            }

            .hub-carousel-section {
                order: 2;
                flex-grow: 0;
            }

            .carousel-section-label {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                padding: 0 14px 8px;
                font-size: 0.82rem;
                font-weight: 700;
                color: var(--secondary-accent);
            }

            .carousel-section-label::before,
            .carousel-section-label::after {
                content: '';
                flex: 1;
                max-width: 48px;
                height: 1px;
                background: rgba(0, 114, 255, 0.25);
            }

            .description-card {
                border-radius: 14px;
            }

            .guide-toggle.is-collapsed {
                padding: 12px 14px;
            }

            .guide-toggle.is-open {
                padding: 14px 16px 16px;
            }

            .guide-toggle-hint {
                font-size: 0.68rem;
            }

            .guide-toggle-header {
                min-height: 44px;
            }

            .description-text {
                font-size: 0.84rem;
                line-height: 1.6;
            }

            .guide-steps {
                font-size: 0.82rem;
                padding-left: 1.1em;
            }

            .guide-steps li {
                margin-bottom: 10px;
            }

            .concept-card {
                padding: 14px 16px;
                margin-bottom: 10px;
            }

            .concept-note {
                font-size: 0.84rem;
                line-height: 1.65;
            }

            .print-link-btn {
                display: flex;
                width: 100%;
                font-size: 0.86rem;
                padding: 12px 16px;
            }

            .carousel-wrapper {
                flex-grow: 0;
                min-height: 0;
                padding: 0 0 4px;
            }

            .carousel-track {
                min-height: 320px;
                touch-action: pan-y pinch-zoom;
            }

            .card-container {
                width: min(240px, 82vw);
                padding: 20px 18px 18px;
                border-radius: 20px;
            }

            .card-avatar {
                width: 96px;
                height: 96px;
                margin-bottom: 12px;
            }

            .card-title {
                font-size: 1.1rem;
            }

            .card-desc {
                font-size: 0.8rem;
                margin-bottom: 14px;
                min-height: 1.2em;
            }

            .card-cta {
                width: 100%;
                font-size: 0.95rem;
                padding: 12px 20px;
            }

            .nav-arrow {
                width: 40px;
                height: 40px;
                top: 50%;
                font-size: 0.85rem;
            }

            .nav-arrow-prev {
                left: 6px;
            }

            .nav-arrow-next {
                right: 6px;
            }

            .carousel-dots {
                padding: 10px 14px 6px;
                gap: 10px;
            }

            .carousel-dot {
                min-width: 10px;
                min-height: 10px;
                padding: 6px;
                background-clip: content-box;
            }

            .hub-footer {
                padding: 8px 10px calc(16px + env(safe-area-inset-bottom, 0px));
                order: 4;
            }
        }

        @media (min-width: 769px) {
            body {
                overflow: hidden;
            }

            #root,
            .app-shell {
                height: 100vh;
            }

            .hub-title-wrap {
                padding: 24px 20px 0;
                order: 1;
            }

            .hub-info-section {
                padding-bottom: 12px;
                order: 2;
            }

            .hub-carousel-section {
                order: 3;
                flex: 1;
            }

            .hub-footer {
                order: 4;
            }

            .header-title {
                margin-bottom: 20px;
            }
        }

        @media (max-width: 768px) and (max-height: 740px) {
            .header-title {
                font-size: 1.1rem;
            }

            .carousel-track {
                min-height: 280px;
            }

            .card-container {
                width: min(220px, 78vw);
                padding: 16px 14px;
            }

            .card-avatar {
                width: 80px;
                height: 80px;
            }
        }

        @media (max-width: 380px) {
            .guide-toggle-hint {
                display: none;
            }

            .gallery-back-link {
                max-width: 34vw;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <link rel="stylesheet" href="ar-howto.css">
    <script src="ar-howto.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Data for AR Projects
        const projects = [
            { id: 1, title: "Doomy", link: "ar_doomy.html", image: "../3dartensyu3/ar/01/doom.jpg", desc: "" },
            { id: 2, title: "Fox", link: "fox_ar.html", image: "../3dartensyu3/ar/03/ロゴ.jpg", desc: "" },
            { id: 3, title: "肥後 椿", link: "higotubaki_ar.html", image: "../3dartensyu3/ar/05/肥後椿マーカー画像.png", desc: "" },
            { id: 4, title: "そらっぺ", link: "sorappe_ar.html", image: "../3dartensyu3/ar/04/poster.png", desc: "" },
            { id: 5, title: "ひなつば ゆい", link: "yui_ar.html", image: "../3dartensyu3/ar/02/ポスター.png", desc: "" },
            { id: 6, title: "Leo", link: "ar_leo.html", image: "../3dartensyu3/ar/06/marker.png", desc: "" },
            { id: 7, title: "飛雄・八枝郎", link: "ar_tobio.html", image: "../3dartensyu3/ar/07/poster.png", desc: "" },
            { id: 8, title: "たる吉", link: "ar_tarukichi.html", image: "../3dartensyu3/ar/08/たる吉.png", desc: "" },
            { id: 9, title: "刀奈権", link: "ar_katanagonn.html", image: "../3dartensyu3/ar/09/motihuirasuto.png", desc: "" },
            { id: 10, title: "みく御成ちゃん", link: "ar_mikugyosei.html", image: "../3dartensyu3/ar/10/みく御成ちゃん画像.png", desc: "" },
            { id: 11, title: "いちさん", link: "ar_ichisan.html", image: "../3dartensyu3/ar/11/ichisan_icon.jpeg", desc: "3D準備中" }
        ];

        const HubInfoSection = () => {
            const [guideOpen, setGuideOpen] = useState(false);

            return (
                <section className="hub-info-section" aria-label="作品について・遊び方">
                    <div className="description-card concept-card">
                        <div className="section-label">
                            <span className="section-label-bar"></span>
                            <span className="section-label-text">ABOUT</span>
                        </div>
                        <p className="concept-note">
                            3年生のゲームキャラクターデザインの学習成果です。九州のランドマークなどをモチーフに、デザインから3Dモデリングまで約1か月で制作しました。
                        </p>
                    </div>

                    <div className={`description-card guide-toggle ${guideOpen ? 'is-open' : 'is-collapsed'}`}>
                        <button
                            type="button"
                            className="guide-toggle-header"
                            onClick={() => setGuideOpen((open) => !open)}
                            aria-expanded={guideOpen}
                            aria-controls="guide-toggle-body"
                        >
                            <div className="section-label">
                                <span className="section-label-bar"></span>
                                <span className="section-label-text">ARの楽しみ方</span>
                            </div>
                            <div className="guide-toggle-meta">
                                {!guideOpen && <span className="guide-toggle-hint">タップして開く</span>}
                                <span className="guide-toggle-chevron" aria-hidden="true">▼</span>
                            </div>
                        </button>
                        <div
                            id="guide-toggle-body"
                            className={`guide-toggle-body ${guideOpen ? 'is-visible' : ''}`}
                        >
                            <p className="description-text">
                                スマートフォンで<strong>マーカー画像</strong>をカメラに映すと、3Dキャラクターが飛び出して見えます。アプリのインストールは不要です。
                            </p>
                            <ol className="guide-steps">
                                <li>キャラクター一覧から<strong>好きなキャラ</strong>を選び「ARを見る」をタップ</li>
                                <li><strong>マーカー</strong>を用意（<a href="ar_marker_print.html" style={{ color: 'var(--secondary-accent)', fontWeight: 700 }}>印刷用ページ</a>でコースター大サイズ推奨）</li>
                                <li>ARページでカメラを許可し、<strong>マーカーを映す</strong>とキャラクターが表示されます</li>
                            </ol>
                            <a href="ar_marker_print.html" className="print-link-btn">マーカー印刷用ページへ</a>
                        </div>
                    </div>
                </section>
            );
        };

        const Carousel = () => {
            const [activeIndex, setActiveIndex] = useState(0);
            const [isDragging, setIsDragging] = useState(false);
            const [startX, setStartX] = useState(0);
            const [dragOffset, setDragOffset] = useState(0);
            const [isMobile, setIsMobile] = useState(() => window.innerWidth <= 768);
            const containerRef = useRef(null);

            useEffect(() => {
                const mq = window.matchMedia('(max-width: 768px)');
                const onChange = () => setIsMobile(mq.matches);
                onChange();
                mq.addEventListener('change', onChange);
                return () => mq.removeEventListener('change', onChange);
            }, []);

            const getWrappedIndex = (index) => {
                const len = projects.length;
                return ((index % len) + len) % len;
            };

            const handleDragStart = (e) => {
                setIsDragging(true);
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                setStartX(clientX);
            };

            const handleDragMove = (e) => {
                if (!isDragging) return;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const offset = clientX - startX;
                setDragOffset(offset);
            };

            const handleDragEnd = () => {
                setIsDragging(false);
                const threshold = 50;
                if (dragOffset > threshold) {
                    setActiveIndex((prev) => getWrappedIndex(prev - 1));
                } else if (dragOffset < -threshold) {
                    setActiveIndex((prev) => getWrappedIndex(prev + 1));
                }
                setDragOffset(0);
            };

            const goNext = () => setActiveIndex((prev) => getWrappedIndex(prev + 1));
            const goPrev = () => setActiveIndex((prev) => getWrappedIndex(prev - 1));

            return (
                <div className="carousel-wrapper">

                    {/* Navigation Arrows */}
                    <div className="nav-arrow nav-arrow-prev" onClick={goPrev}>
                        ◀
                    </div>
                    <div className="nav-arrow nav-arrow-next" onClick={goNext}>
                        ▶
                    </div>

                    <div
                        ref={containerRef}
                        className="carousel-track"
                        style={{
                            cursor: isDragging ? 'grabbing' : 'grab'
                        }}
                        onMouseDown={handleDragStart}
                        onMouseMove={handleDragMove}
                        onMouseUp={handleDragEnd}
                        onMouseLeave={handleDragEnd}
                        onTouchStart={handleDragStart}
                        onTouchMove={handleDragMove}
                        onTouchEnd={handleDragEnd}
                    >
                        {projects.map((project, index) => {
                            const len = projects.length;
                            let offset = index - activeIndex;

                            if (offset > len / 2) offset -= len;
                            if (offset < -len / 2) offset += len;

                            const dragShift = dragOffset / 300;
                            const effectiveOffset = offset + dragShift;
                            const isActive = Math.round(effectiveOffset) === 0;

                            const distance = Math.abs(effectiveOffset);
                            const scale = Math.max(0.75, 1 - distance * 0.15);
                            const opacity = Math.max(0.5, 1 - distance * 0.3);
                            const zIndex = 100 - Math.round(distance * 10);

                            const xStep = isMobile ? 50 : 65;
                            const x = effectiveOffset * xStep;
                            const hideDistance = isMobile ? 1.6 : 2.5;
                            const display = distance > hideDistance ? 'none' : 'block';

                            return (
                                <div key={project.id} className="card-container" style={{
                                    transition: isDragging ? 'none' : 'all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)',
                                    transform: `translate(calc(-50% + ${x}%), -50%) scale(${scale})`,
                                    opacity: opacity,
                                    zIndex: zIndex,
                                    display: display,
                                    pointerEvents: isActive ? 'auto' : 'none',
                                    border: isActive ? `2px solid var(--primary-accent)` : '1px solid transparent'
                                }}>
                                    <div className="card-avatar">
                                        <img src={project.image} alt={project.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                                    </div>
                                    <h3 className="card-title">{project.title}</h3>
                                    <p className="card-desc">{project.desc || '\u00A0'}</p>
                                    <a
                                        href={project.link}
                                        className={`card-cta ${isActive ? 'is-active' : 'is-inactive'}`}
                                        aria-hidden={!isActive}
                                        tabIndex={isActive ? 0 : -1}
                                    >
                                        ARを見る
                                    </a>
                                </div>
                            );
                        })}
                    </div>

                    {/* Bottom Slider/Dots */}
                    <div className="carousel-dots" role="tablist" aria-label="キャラクター選択">
                        {projects.map((project, idx) => (
                            <button
                                key={idx}
                                type="button"
                                role="tab"
                                aria-selected={activeIndex === idx}
                                aria-label={project.title}
                                className={`carousel-dot ${activeIndex === idx ? 'is-active' : ''}`}
                                onClick={() => setActiveIndex(idx)}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            useEffect(() => {
                if (typeof window.initArHowto === 'function') {
                    window.initArHowto();
                }
            }, []);

            return (
                <div className="app-shell">
                    <a href="../gallery.html" className="gallery-back-link">← ギャラリーに戻る</a>
                    <div className="hub-title-wrap">
                        <h1 className="header-title">飛び出す!ARキャラクター</h1>
                    </div>
                    <section className="hub-carousel-section" aria-label="キャラクター一覧">
                        <p className="carousel-section-label">キャラクターを選ぶ</p>
                        <Carousel />
                    </section>
                    <HubInfoSection />
                    <footer className="hub-footer">
                        &copy; Soda3DART Class Project
                    </footer>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
