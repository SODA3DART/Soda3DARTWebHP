<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飛び出すARキャラクター | Soda3DART</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --primary-accent: #00c6ff;
            --secondary-accent: #0072ff;
            --bg-color: #f8f9fa;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --shadow-hover: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(0, 198, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 114, 255, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Zen Kaku Gothic New', 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #root {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header-container {
            text-align: center;
            padding: 30px 20px;
            z-index: 10;
            position: relative;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin: 0 0 25px 0;
            letter-spacing: 0.05em;
            text-shadow: 0 10px 20px rgba(0, 198, 255, 0.15);
        }

        .description-card {
            max-width: 640px;
            width: 100%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 24px 32px;
            box-sizing: border-box;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            text-align: left;
        }

        .guide-toggle.is-collapsed {
            padding: 12px 18px;
            border: 2px solid rgba(0, 114, 255, 0.35);
            animation: guidePulse 2.4s ease-in-out infinite;
        }

        .guide-toggle.is-open {
            padding: 20px 24px 24px;
            animation: none;
        }

        @keyframes guidePulse {
            0%, 100% {
                border-color: rgba(0, 114, 255, 0.35);
                box-shadow: 0 4px 18px rgba(0, 114, 255, 0.12), 0 0 0 0 rgba(0, 198, 255, 0);
            }
            50% {
                border-color: rgba(0, 198, 255, 0.85);
                box-shadow: 0 6px 24px rgba(0, 114, 255, 0.22), 0 0 0 5px rgba(0, 198, 255, 0.18);
            }
        }

        @keyframes guideBarPulse {
            0%, 100% { background: var(--primary-accent); }
            50% { background: var(--secondary-accent); }
        }

        .guide-toggle.is-collapsed .section-label-bar {
            animation: guideBarPulse 2.4s ease-in-out infinite;
        }

        .guide-toggle-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
        }

        .guide-toggle-header .section-label {
            flex: 1;
            margin-bottom: 0;
        }

        .guide-toggle-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .guide-toggle-hint {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--secondary-accent);
            white-space: nowrap;
        }

        .guide-toggle-chevron {
            font-size: 0.7rem;
            color: var(--secondary-accent);
            transition: transform 0.3s ease;
        }

        .guide-toggle.is-open .guide-toggle-chevron {
            transform: rotate(180deg);
        }

        .guide-toggle-body {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
            margin-top: 0;
        }

        .guide-toggle-body.is-visible {
            max-height: 520px;
            opacity: 1;
            margin-top: 14px;
        }

        .description-text {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-main);
            margin: 0;
            font-weight: 500;
        }

        .sub-text {
            display: block;
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .section-label {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .section-label-bar {
            display: inline-block;
            width: 4px;
            height: 1.2em;
            background: var(--primary-accent);
            margin-right: 10px;
            border-radius: 2px;
        }

        .section-label-text {
            font-weight: 700;
            color: var(--secondary-accent);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
        }

        .guide-steps {
            margin: 14px 0 0;
            padding-left: 1.2em;
            font-size: 0.92rem;
            line-height: 1.65;
        }

        .guide-steps li {
            margin-bottom: 8px;
        }

        .guide-body-short {
            display: none;
        }

        .guide-steps-compact {
            margin-top: 0;
        }

        .guide-steps-compact li {
            margin-bottom: 6px;
        }

        .guide-marker-optional {
            display: none;
            margin: 10px 0 0;
            font-size: 0.78rem;
            color: var(--text-sub);
            line-height: 1.5;
        }

        .guide-marker-optional a {
            color: var(--secondary-accent);
            font-weight: 600;
            text-decoration: none;
        }

        .print-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            padding: 12px 18px;
            min-height: 44px;
            background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(0, 114, 255, 0.25);
            -webkit-tap-highlight-color: transparent;
        }

        .print-link-btn:hover {
            opacity: 0.92;
        }

        .concept-card {
            padding: 18px 24px;
            margin-bottom: 12px;
            text-align: left;
        }

        .concept-card .section-label {
            margin-bottom: 10px;
        }

        .concept-note {
            margin: 0;
            font-size: 0.88rem;
            color: var(--text-main);
            line-height: 1.75;
            font-weight: 500;
        }

        .concept-note-short {
            display: none;
        }

        .gallery-back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 300;
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.85);
            color: #0072ff;
            border: 1px solid rgba(0, 114, 255, 0.2);
            border-radius: 50px;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 16px rgba(0, 114, 255, 0.12);
        }

        .gallery-back-link:hover {
            background: #fff;
        }

        .carousel-wrapper {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 0;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 200;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-arrow-prev {
            left: 10px;
        }

        .nav-arrow-next {
            right: 10px;
        }

        .card-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280px;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: var(--shadow-hover);
            text-align: center;
        }

        .carousel-track {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 380px;
            touch-action: pan-y;
        }

        .card-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 15px;
            overflow: hidden;
            border: 4px solid #f0f0f0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
        }

        .card-desc {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 15px;
            min-height: 2.5em;
        }

        .hub-footer {
            text-align: center;
            padding: 10px;
            color: var(--text-sub);
            font-size: 0.75rem;
            opacity: 0.7;
            flex-shrink: 0;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
            }

            .app-shell {
                min-height: 100dvh;
                height: auto;
            }

            .gallery-back-link {
                top: 12px;
                left: 10px;
                padding: 8px 14px;
                font-size: 0.78rem;
                max-width: 42vw;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .header-container {
                padding: 58px 14px 12px;
            }

            .header-title {
                font-size: 1.35rem;
                margin: 0 0 12px 0;
                line-height: 1.3;
            }

            .description-card {
                border-radius: 16px;
            }

            .guide-toggle.is-collapsed {
                padding: 10px 14px;
            }

            .guide-toggle.is-open {
                padding: 14px 16px 16px;
            }

            .guide-toggle-hint {
                font-size: 0.7rem;
            }

            .description-text {
                font-size: 0.82rem;
                line-height: 1.55;
            }

            .guide-steps {
                font-size: 0.8rem;
            }

            .concept-card {
                padding: 14px 16px;
                margin-bottom: 10px;
            }

            .concept-note-full {
                display: none;
            }

            .concept-note-short {
                display: block;
                font-size: 0.84rem;
                line-height: 1.65;
            }

            .guide-body-full {
                display: none;
            }

            .guide-body-short {
                display: block;
            }

            .guide-steps-compact {
                font-size: 0.88rem;
                line-height: 1.5;
            }

            .guide-steps-compact li {
                margin-bottom: 4px;
            }

            .guide-marker-optional {
                display: block;
            }

            .print-link-btn {
                display: none;
            }

            .carousel-wrapper {
                flex-grow: 0;
                min-height: 0;
                padding: 8px 0 4px;
            }

            .carousel-track {
                min-height: 340px;
            }

            .card-container {
                width: min(220px, 78vw);
                padding: 18px 16px;
                border-radius: 22px;
            }

            .card-avatar {
                width: 88px;
                height: 88px;
                margin-bottom: 10px;
            }

            .card-title {
                font-size: 1.05rem;
            }

            .card-desc {
                font-size: 0.8rem;
                margin-bottom: 12px;
                min-height: 1.5em;
            }

            .nav-arrow {
                width: 36px;
                height: 36px;
                top: 46%;
            }

            .nav-arrow-prev {
                left: 4px;
            }

            .nav-arrow-next {
                right: 4px;
            }

            .hub-footer {
                padding: 8px 10px 16px;
            }
        }

        @media (min-width: 769px) {
            body {
                overflow: hidden;
            }

            #root,
            .app-shell {
                height: 100vh;
            }
        }

        @media (max-width: 768px) and (max-height: 740px) {
            .header-title {
                font-size: 1.2rem;
                margin-bottom: 8px;
            }

            .carousel-track {
                min-height: 300px;
            }

            .card-container {
                width: min(200px, 74vw);
                padding: 14px 12px;
            }

            .card-avatar {
                width: 76px;
                height: 76px;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <link rel="stylesheet" href="ar-howto.css">
    <script src="ar-howto.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Data for AR Projects
        const projects = [
            { id: 1, title: "Doomy", link: "ar_doomy.html", image: "../3dartensyu3/ar/01/doom.jpg", desc: "" },
            { id: 2, title: "Fox", link: "fox_ar.html", image: "../3dartensyu3/ar/03/ロゴ.jpg", desc: "" },
            { id: 3, title: "肥後 椿", link: "higotubaki_ar.html", image: "../3dartensyu3/ar/05/肥後椿マーカー画像.png", desc: "" },
            { id: 4, title: "そらっぺ", link: "sorappe_ar.html", image: "../3dartensyu3/ar/04/poster.png", desc: "" },
            { id: 5, title: "ひなつば ゆい", link: "yui_ar.html", image: "../3dartensyu3/ar/02/ポスター.png", desc: "" },
            { id: 6, title: "Leo", link: "ar_leo.html", image: "../3dartensyu3/ar/06/marker.png", desc: "" },
            { id: 7, title: "飛雄・八枝郎", link: "ar_tobio.html", image: "../3dartensyu3/ar/07/poster.png", desc: "" },
            { id: 8, title: "たる吉", link: "ar_tarukichi.html", image: "../3dartensyu3/ar/08/たる吉.png", desc: "" },
            { id: 9, title: "刀奈権", link: "ar_katanagonn.html", image: "../3dartensyu3/ar/09/motihuirasuto.png", desc: "" },
            { id: 10, title: "みく御成ちゃん", link: "ar_mikugyosei.html", image: "../3dartensyu3/ar/10/みく御成ちゃん画像.png", desc: "" },
            { id: 11, title: "いちさん", link: "ar_ichisan.html", image: "../3dartensyu3/ar/11/ichisan_icon.jpeg", desc: "3D準備中" }
        ];

        const Header = () => {
            const [guideOpen, setGuideOpen] = useState(false);

            return (
                <header className="header-container">
                    <h1 className="header-title">
                        飛び出す!ARキャラクター
                    </h1>

                    <div className="description-card concept-card">
                        <div className="section-label">
                            <span className="section-label-bar"></span>
                            <span className="section-label-text">ABOUT</span>
                        </div>
                        <p className="concept-note concept-note-full">
                            3年生のゲームキャラクターデザインの学習成果です。九州のランドマークなどをモチーフに、デザインから3Dモデリングまで約1か月で制作しました。
                        </p>
                        <p className="concept-note concept-note-short">
                            3年生作品。地面タップでAR体験（アプリ不要）
                        </p>
                    </div>

                    <div className={`description-card guide-toggle ${guideOpen ? 'is-open' : 'is-collapsed'}`}>
                        <button
                            type="button"
                            className="guide-toggle-header"
                            onClick={() => setGuideOpen((open) => !open)}
                            aria-expanded={guideOpen}
                            aria-controls="guide-toggle-body"
                        >
                            <div className="section-label">
                                <span className="section-label-bar"></span>
                                <span className="section-label-text">ARの楽しみ方</span>
                            </div>
                            <div className="guide-toggle-meta">
                                {!guideOpen && <span className="guide-toggle-hint">タップして開く</span>}
                                <span className="guide-toggle-chevron" aria-hidden="true">▼</span>
                            </div>
                        </button>
                        <div
                            id="guide-toggle-body"
                            className={`guide-toggle-body ${guideOpen ? 'is-visible' : ''}`}
                        >
                            <div className="guide-body-full">
                                <p className="description-text">
                                    スマートフォンで<strong>マーカー画像</strong>をカメラに映すと、3Dキャラクターが飛び出して見えます。アプリのインストールは不要です。
                                </p>
                                <ol className="guide-steps">
                                    <li>下からキャラクターを選び「<strong>ARを見る</strong>」をタップ</li>
                                    <li><a href="ar_marker_print.html" style={{ color: 'var(--secondary-accent)', fontWeight: 700 }}>印刷用ページ</a>でマーカーを用意（コースター大・90mm角推奨）</li>
                                    <li>カメラを許可し、<strong>マーカーを映す</strong>とキャラクターが表示されます</li>
                                </ol>
                            </div>
                            <div className="guide-body-short">
                                <ol className="guide-steps guide-steps-compact">
                                    <li>キャラを選ぶ →「<strong>ARを見る</strong>」</li>
                                    <li>地面を<strong>タップ</strong>して配置</li>
                                </ol>
                                <p className="guide-marker-optional">
                                    マーカー派は左下ボタンで切替 · <a href="ar_marker_print.html">印刷</a>
                                </p>
                            </div>
                            <a href="ar_marker_print.html" className="print-link-btn">マーカー印刷用ページへ</a>
                        </div>
                    </div>
                </header>
            );
        };

        const Carousel = () => {
            const [activeIndex, setActiveIndex] = useState(0);
            const [isDragging, setIsDragging] = useState(false);
            const [startX, setStartX] = useState(0);
            const [dragOffset, setDragOffset] = useState(0);
            const containerRef = useRef(null);

            const getWrappedIndex = (index) => {
                const len = projects.length;
                return ((index % len) + len) % len;
            };

            const handleDragStart = (e) => {
                setIsDragging(true);
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                setStartX(clientX);
            };

            const handleDragMove = (e) => {
                if (!isDragging) return;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const offset = clientX - startX;
                setDragOffset(offset);
            };

            const handleDragEnd = () => {
                setIsDragging(false);
                const threshold = 50;
                if (dragOffset > threshold) {
                    setActiveIndex((prev) => getWrappedIndex(prev - 1));
                } else if (dragOffset < -threshold) {
                    setActiveIndex((prev) => getWrappedIndex(prev + 1));
                }
                setDragOffset(0);
            };

            const goNext = () => setActiveIndex((prev) => getWrappedIndex(prev + 1));
            const goPrev = () => setActiveIndex((prev) => getWrappedIndex(prev - 1));

            return (
                <div className="carousel-wrapper">

                    {/* Navigation Arrows */}
                    <div className="nav-arrow nav-arrow-prev" onClick={goPrev}>
                        ◀
                    </div>
                    <div className="nav-arrow nav-arrow-next" onClick={goNext}>
                        ▶
                    </div>

                    <div
                        ref={containerRef}
                        className="carousel-track"
                        style={{
                            cursor: isDragging ? 'grabbing' : 'grab'
                        }}
                        onMouseDown={handleDragStart}
                        onMouseMove={handleDragMove}
                        onMouseUp={handleDragEnd}
                        onMouseLeave={handleDragEnd}
                        onTouchStart={handleDragStart}
                        onTouchMove={handleDragMove}
                        onTouchEnd={handleDragEnd}
                    >
                        {projects.map((project, index) => {
                            const len = projects.length;
                            let offset = index - activeIndex;

                            if (offset > len / 2) offset -= len;
                            if (offset < -len / 2) offset += len;

                            const dragShift = dragOffset / 300;
                            const effectiveOffset = offset + dragShift;
                            const isActive = Math.round(effectiveOffset) === 0;

                            const distance = Math.abs(effectiveOffset);
                            const scale = Math.max(0.75, 1 - distance * 0.15);
                            const opacity = Math.max(0.5, 1 - distance * 0.3);
                            const zIndex = 100 - Math.round(distance * 10);

                            const x = effectiveOffset * 65;
                            const display = distance > 2.5 ? 'none' : 'block';

                            return (
                                <div key={project.id} className="card-container" style={{
                                    transition: isDragging ? 'none' : 'all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)',
                                    transform: `translate(calc(-50% + ${x}%), -50%) scale(${scale})`,
                                    opacity: opacity,
                                    zIndex: zIndex,
                                    display: display,
                                    pointerEvents: isActive ? 'auto' : 'none',
                                    border: isActive ? `2px solid var(--primary-accent)` : '1px solid transparent'
                                }}>
                                    <div className="card-avatar">
                                        <img src={project.image} alt={project.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                                    </div>
                                    <h3 className="card-title">{project.title}</h3>
                                    <p className="card-desc">{project.desc}</p>
                                    <a href={project.link} style={{
                                        display: 'inline-block',
                                        padding: '10px 25px',
                                        background: 'linear-gradient(135deg, var(--secondary-accent), var(--primary-accent))',
                                        color: 'white',
                                        textDecoration: 'none',
                                        borderRadius: '50px',
                                        fontWeight: '600',
                                        opacity: isActive ? 1 : 0,
                                        transform: isActive ? 'scale(1)' : 'scale(0.8)',
                                        transition: 'opacity 0.3s, transform 0.3s',
                                        fontSize: '0.9rem'
                                    }}>
                                        ARを見る
                                    </a>
                                </div>
                            );
                        })}
                    </div>

                    {/* Bottom Slider/Dots */}
                    <div style={{
                        textAlign: 'center',
                        padding: '15px',
                        display: 'flex',
                        justifyContent: 'center',
                        gap: '8px',
                        zIndex: 200,
                        flexShrink: 0
                    }}>
                        {projects.map((_, idx) => (
                            <div
                                key={idx}
                                onClick={() => setActiveIndex(idx)}
                                style={{
                                    width: activeIndex === idx ? '24px' : '8px',
                                    height: '8px',
                                    borderRadius: '4px',
                                    background: activeIndex === idx ? 'var(--primary-accent)' : 'rgba(0,0,0,0.2)',
                                    transition: 'all 0.3s',
                                    cursor: 'pointer'
                                }}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            useEffect(() => {
                if (typeof window.initArHowto === 'function') {
                    window.initArHowto();
                }
            }, []);

            return (
                <div className="app-shell">
                    <a href="../gallery.html" className="gallery-back-link">← ギャラリーに戻る</a>
                    <Header />
                    <Carousel />
                    <footer className="hub-footer">
                        &copy; Soda3DART Class Project
                    </footer>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
