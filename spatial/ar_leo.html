<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script>
        AFRAME.registerComponent('toon-render', {
            init: function () {
                this.gradientMap = this.createGradientMap();
                this.el.addEventListener('model-loaded', () => {
                    requestAnimationFrame(() => this.applyToonMaterials());
                });
            },
            createGradientMap: function () {
                if (!THREE.MeshToonMaterial) return null;
                const steps = 4;
                const data = new Uint8Array(steps * 4);
                for (let i = 0; i < steps; i++) {
                    const shade = Math.floor(255 * (i / (steps - 1)));
                    const offset = i * 4;
                    data[offset] = shade;
                    data[offset + 1] = shade;
                    data[offset + 2] = shade;
                    data[offset + 3] = 255;
                }
                const tex = new THREE.DataTexture(data, steps, 1, THREE.RGBAFormat);
                tex.needsUpdate = true;
                tex.minFilter = THREE.NearestFilter;
                tex.magFilter = THREE.NearestFilter;
                return tex;
            },
            isOutlineMesh: function (node, mat) {
                const nodeName = node.name.toLowerCase();
                const matName = mat.name ? mat.name.toLowerCase() : '';
                return nodeName.includes('outline') || matName.includes('outline');
            },
            getModelRoot: function () {
                return this.el.getObject3D('mesh') || this.el.object3D;
            },
            createToonMaterial: function (mat) {
                const useAlpha = mat.transparent || mat.alphaTest > 0;
                const params = {
                    color: mat.color ? mat.color.clone() : new THREE.Color(0xffffff),
                    map: mat.map || null,
                    normalMap: mat.normalMap || null,
                    alphaMap: mat.alphaMap || null,
                    transparent: useAlpha,
                    opacity: mat.opacity !== undefined ? mat.opacity : 1,
                    alphaTest: mat.alphaTest || 0,
                    side: THREE.DoubleSide,
                    depthWrite: !useAlpha
                };
                if (this.gradientMap) params.gradientMap = this.gradientMap;
                if (mat.emissive) {
                    params.emissive = mat.emissive.clone();
                    params.emissiveMap = mat.emissiveMap || null;
                }
                return new THREE.MeshToonMaterial(params);
            },
            applyToonMaterials: function () {
                const obj = this.getModelRoot();
                if (!obj) return;

                if (!THREE.MeshToonMaterial) {
                    this.applyDoubleSidedFallback(obj);
                    return;
                }

                obj.traverse((node) => {
                    if (!node.isMesh || !node.material) return;

                    const materials = Array.isArray(node.material) ? node.material : [node.material];
                    const converted = materials.map((mat) => {
                        if (this.isOutlineMesh(node, mat)) {
                            mat.transparent = false;
                            mat.depthWrite = true;
                            mat.side = THREE.FrontSide;
                            return mat;
                        }
                        try {
                            return this.createToonMaterial(mat);
                        } catch (err) {
                            console.warn('toon-render: fallback for', node.name, err);
                            mat.side = THREE.DoubleSide;
                            mat.depthWrite = true;
                            return mat;
                        }
                    });

                    node.material = Array.isArray(node.material) ? converted : converted[0];
                });
            },
            applyDoubleSidedFallback: function (obj) {
                obj.traverse((node) => {
                    if (!node.isMesh || !node.material) return;
                    const materials = Array.isArray(node.material) ? node.material : [node.material];
                    materials.forEach((mat) => {
                        if (!this.isOutlineMesh(node, mat)) {
                            mat.side = THREE.DoubleSide;
                        }
                        mat.depthWrite = true;
                    });
                });
            }
        });
    </script>
    <title>Leo AR</title>
    <style>
        #marker-ui-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            padding: 8px 18px;
            background: rgba(20, 20, 30, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        #marker-ui-btn:hover {
            background: rgba(40, 40, 55, 0.9);
        }

        .marker-overlay {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease;
        }

        .marker-overlay.is-open {
            opacity: 1;
            visibility: visible;
        }

        .marker-panel {
            max-width: min(92vw, 440px);
            background: #1a1a24;
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            font-family: sans-serif;
            color: #eee;
        }

        .marker-panel h2 {
            margin: 0 0 10px 0;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .marker-panel p {
            margin: 0 0 12px 0;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #bbb;
        }

        .marker-panel img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            background: #fff;
        }

        .marker-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
            gap: 10px;
        }

        .marker-close {
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .marker-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #mode-ui-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            padding: 8px 18px;
            background: rgba(20, 20, 30, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        #mode-ui-btn:hover {
            background: rgba(40, 40, 55, 0.9);
        }
    </style>
</head>

<body>
    <a href="ar_character_hub.html"
        style="position: absolute; top: 20px; left: 20px; z-index: 1000; padding: 8px 20px; background: rgba(20, 20, 30, 0.6); color: white; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; text-decoration: none; font-family: sans-serif; backdrop-filter: blur(10px);">←
        一覧に戻る</a>
    <button type="button" id="marker-ui-btn" aria-expanded="false" aria-controls="marker-overlay">マーカーを表示</button>
    <button type="button" id="mode-ui-btn" aria-pressed="false">ポスターモード</button>
    <audio id="bgm" src="../3dartensyu3/ar/06/Dream_diffuser.mp3" preload="auto" loop playsinline></audio>
    <div id="marker-overlay" class="marker-overlay" role="dialog" aria-modal="true" aria-labelledby="marker-dialog-title" hidden>
        <div class="marker-panel">
            <h2 id="marker-dialog-title">Leo AR のマーカー</h2>
            <p>下の画像と同じものをカメラで映すと、キャラクターが表示されます。</p>
            <img src="../3dartensyu3/ar/06/marker.png" alt="Leo AR 用マーカー画像" />
            <div class="marker-actions">
                <button type="button" class="marker-close" id="marker-close-btn">閉じる</button>
            </div>
        </div>
    </div>
    <a-scene mindar-image="imageTargetSrc: ../3dartensyu3/ar/06/targets.mind;" color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights: false" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        <a-light type="ambient" color="#f5f8ff" intensity="0.55"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.85" position="1 2 0.5"></a-light>
        <a-assets>
            <a-asset-item id="yui" src="../3dartensyu3/ar/06/Leo.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target">
            <a-entity id="leo-model" gltf-model="#yui" rotation="90 0 0" position="0 0 0" scale="0.3 0.3 0.3"
                animation-mixer="clip: *; loop: repeat;" toon-render></a-entity>
        </a-entity>
    </a-scene>
    <script>
        (function () {
            const MODE_ROTATION = {
                stand: '90 0 0',
                poster: '0 0 0'
            };
            const POSTER_Y_OFFSET = -0.45;

            const scene = document.querySelector('a-scene');
            const leoModel = document.querySelector('#leo-model');
            if (leoModel && !leoModel.dataset.standPosition) {
                leoModel.dataset.standPosition = leoModel.getAttribute('position') || '0 0 0';
            }
            const audio = document.getElementById('bgm');
            const modeBtn = document.getElementById('mode-ui-btn');
            let displayMode = 'stand';
            let audioUnlocked = false;
            let markerVisible = false;

            function applyDisplayMode() {
                if (leoModel) {
                    leoModel.setAttribute('rotation', MODE_ROTATION[displayMode]);
                    const parts = leoModel.dataset.standPosition.split(' ').map(Number);
                    if (displayMode === 'poster') {
                        leoModel.setAttribute('position', `${parts[0]} ${parts[1] + POSTER_Y_OFFSET} ${parts[2]}`);
                    } else {
                        leoModel.setAttribute('position', leoModel.dataset.standPosition);
                    }
                }
                const isPoster = displayMode === 'poster';
                modeBtn.textContent = isPoster ? '立体モード' : 'ポスターモード';
                modeBtn.setAttribute('aria-pressed', isPoster ? 'true' : 'false');
            }

            modeBtn.addEventListener('click', () => {
                displayMode = displayMode === 'stand' ? 'poster' : 'stand';
                applyDisplayMode();
            });

            async function unlockAudio() {
                if (audioUnlocked || !audio) return;
                try {
                    audio.muted = true;
                    await audio.play();
                    audio.pause();
                    audio.currentTime = 0;
                    audio.muted = false;
                    audioUnlocked = true;
                    if (markerVisible) await playBgm();
                } catch (err) {
                    console.warn('Audio unlock failed:', err);
                }
            }

            async function playBgm() {
                if (!audio) return;
                if (!audioUnlocked) {
                    await unlockAudio();
                    if (!audioUnlocked) return;
                }
                try {
                    if (audio.paused) await audio.play();
                } catch (err) {
                    console.warn('BGM play failed:', err);
                }
            }

            function pauseBgm() {
                if (!audio) return;
                audio.pause();
                audio.currentTime = 0;
            }

            function setupMarkerAudio() {
                const target = document.querySelector('#target');
                if (!target) return;

                target.addEventListener('targetFound', () => {
                    markerVisible = true;
                    playBgm();
                });

                target.addEventListener('targetLost', () => {
                    markerVisible = false;
                    pauseBgm();
                });
            }

            ['click', 'touchstart'].forEach((evt) => {
                document.body.addEventListener(evt, unlockAudio, { passive: true });
            });

            if (scene.hasLoaded) {
                setupMarkerAudio();
            } else {
                scene.addEventListener('loaded', setupMarkerAudio);
            }

            applyDisplayMode();

            const btn = document.getElementById('marker-ui-btn');
            const overlay = document.getElementById('marker-overlay');
            const closeBtn = document.getElementById('marker-close-btn');
            function openOverlay() {
                overlay.hidden = false;
                overlay.classList.add('is-open');
                btn.setAttribute('aria-expanded', 'true');
            }
            function closeOverlay() {
                overlay.classList.remove('is-open');
                btn.setAttribute('aria-expanded', 'false');
                overlay.hidden = true;
            }
            btn.addEventListener('click', () => openOverlay());
            closeBtn.addEventListener('click', () => closeOverlay());
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeOverlay();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeOverlay();
            });
        })();
    </script>
</body>

</html>
