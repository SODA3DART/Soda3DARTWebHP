<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Poster | Soda3DART</title>
    <!-- MindAR and A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Animation Mixer Component for GLB animations -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #00f2ff;
            --secondary-color: #ff0055;
            --bg-glass: rgba(20, 20, 30, 0.6);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Loading Screen */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
            pointer-events: auto;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Scanning Overlay */
        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 70vw;
            max-width: 400px;
            max-height: 400px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            overflow: hidden;
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
            position: absolute;
            top: 0;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* Header */
        header {
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
            text-align: center;
            pointer-events: auto;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-color);
        }

        /* Footer / Controls */
        footer {
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            text-align: center;
            pointer-events: auto;
        }

        .status-pill {
            display: inline-block;
            padding: 8px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .instruction {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 20px;
            backdrop-filter: blur(10px);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <p>ARシステムを初期化中...</p>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <header>
            <h1>AR Poster</h1>
        </header>

        <div class="scan-frame">
            <div class="scan-line"></div>
        </div>

        <footer>
            <div class="instruction">
                ポスター.pngをカメラで読み込んでください
            </div>
            <div id="status-text" class="status-pill">マーカーをスキャン中...</div>
        </footer>
    </div>

    <!-- AR Scene -->
    <!-- targets2.mindを使用してポスター.pngを認識し、dodaii.glb（土台）とhinatuba.glb（キャラクター）を表示 -->
    <a-scene mindar-image="imageTargetSrc: ../3dartensyu3/ar/02/targets2.mind; uiLoading: no; uiError: no; uiScanning: no;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <!-- 3Dモデルアセット -->
            <a-asset-item id="dodaii-model" src="../3dartensyu3/ar/02/dodaii.glb"></a-asset-item>
            <a-asset-item id="hinatuba-model" src="../3dartensyu3/ar/02/hinatuba.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- ターゲットエンティティ (targets2.mindの最初のターゲット = ポスター.png) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- 土台モデル（ベース） -->
            <a-gltf-model 
                id="dodaii-base"
                src="#dodaii-model" 
                position="0 0 0" 
                rotation="0 0 0" 
                scale="1 1 1">
            </a-gltf-model>

            <!-- キャラクターモデル（アニメーション付き） -->
            <a-entity
                id="hinatuba-character"
                gltf-model="#hinatuba-model"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
                animation-mixer="clip: *; loop: repeat">
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const scene = document.querySelector('a-scene');
            const loadingScreen = document.getElementById('loading-screen');
            const statusText = document.getElementById('status-text');
            const targetEntity = document.querySelector('a-entity[mindar-image-target]');
            const hinatubaModel = document.getElementById('hinatuba-character');

            // ARシステムの準備完了
            scene.addEventListener('arReady', () => {
                loadingScreen.classList.add('hidden');
                statusText.textContent = 'マーカーをスキャン中...';
            });

            // エラーハンドリング
            scene.addEventListener('arError', (event) => {
                statusText.textContent = 'AR初期化エラー';
                console.error('AR Error:', event);
            });

            // ターゲット検出イベント
            if (targetEntity) {
                targetEntity.addEventListener('targetFound', () => {
                    statusText.textContent = 'マーカーを検出しました！';
                    statusText.style.borderColor = '#00f2ff';
                    statusText.style.color = '#00f2ff';

                    // モデルが読み込まれたらアニメーションを開始
                    if (hinatubaModel) {
                        hinatubaModel.addEventListener('model-loaded', () => {
                            // アニメーションミキサーが利用可能な場合、アニメーションを再生
                            const mixer = hinatubaModel.components['animation-mixer'];
                            if (mixer && mixer.mixer) {
                                // すべてのアニメーションクリップを再生
                                mixer.mixer.clipAction(mixer.mixer.clipAction).play();
                            }
                        });
                    }
                });

                targetEntity.addEventListener('targetLost', () => {
                    statusText.textContent = 'マーカーをスキャン中...';
                    statusText.style.borderColor = 'rgba(255,255,255,0.1)';
                    statusText.style.color = 'white';
                });
            }

            // モデル読み込み完了時の処理
            if (hinatubaModel) {
                hinatubaModel.addEventListener('model-loaded', () => {
                    console.log('キャラクターモデルが読み込まれました');
                });

                // アニメーションミキサーコンポーネントが利用可能か確認
                hinatubaModel.addEventListener('loaded', () => {
                    const mixer = hinatubaModel.components['animation-mixer'];
                    if (mixer) {
                        console.log('アニメーションミキサーが初期化されました');
                    }
                });
            }
        });
    </script>
</body>

</html>
