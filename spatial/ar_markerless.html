<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>マーカーレスAR（実験） | Soda3DART</title>
    <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
    <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script async src="../3dartensyu3/ar/018th/libs/xr.js" data-preload-chunks="slam"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
    </style>
</head>
<body>
    <a-scene
        xrweb
        xrextras-loading
        xrextras-runtime-error
        xrextras-tap-recenter
        renderer="colorManagement: true; physicallyCorrectLights: true"
        background="color: #000"
        id="markerless-scene">
        <a-camera position="0 1.6 0"></a-camera>
        <a-entity light="type: ambient; intensity: 0.7"></a-entity>
        <a-entity light="type: directional; intensity: 0.6; position: 2 4 2"></a-entity>
        <a-assets id="markerless-assets" timeout="120000"></a-assets>
        <a-entity id="placed-root" visible="true"></a-entity>
    </a-scene>
    <script src="ar-markerless-config.js"></script>
    <script src="ar-markerless-scene.js"></script>
</body>
</html>
