<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>8th Wall OSS | マーカーレス6DoF AR | Soda3DART</title>

    <!-- 8-Frame (8th Wall用に調整されたA-Frame) -->
    <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>

    <!-- XR Extras (ロード画面・エラーハンドリング・タップリセンタ等) -->
    <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

    <!-- 8th Wall Engine (セルフホスティング: xr-standalone.zip の内容を libs/ に配置) -->
    <!-- オプション: CDNの場合は下記のコメントを外し、libs版の行を削除 -->
    <!-- <script async src="//apps.8thwall.com/xrweb?appKey=YOUR_APP_KEY" data-preload-chunks="slam"></script> -->
    <script async src="./libs/xrweb.js" data-preload-chunks="slam"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        .instruction {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="instruction">地面をタップしてオブジェクトを配置</div>

    <!-- A-Frame Scene with xrweb (8th Wall SLAM / World Effects) -->
    <a-scene
        xrweb
        xrextras-loading
        xrextras-runtime-error
        xrextras-tap-recenter
        renderer="colorManagement: true; physicallyCorrectLights: true"
        background="color: #000">

        <a-camera position="0 1.6 0"></a-camera>

        <!-- 照明 -->
        <a-entity light="type: ambient; intensity: 0.6"></a-entity>
        <a-entity light="type: directional; intensity: 0.8; castShadow: true; position: 2 4 2" shadow="cast: true"></a-entity>

        <!-- タップ配置は app.js の XR8.XrController.hitTest() で実行 -->

        <!-- 初期配置オブジェクト (実寸大・空間固定 = 6DoF) -->
        <a-box id="base-object" position="0 0 -2" rotation="0 45 0" width="0.3" height="0.3" depth="0.3"
            material="roughness: 0.8; metalness: 0.2; color: #00EDAF" shadow="cast: true; receive: true">
        </a-box>

    </a-scene>

    <script src="./app.js"></script>
</body>
</html>
