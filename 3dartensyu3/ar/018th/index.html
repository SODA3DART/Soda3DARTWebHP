<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>8th Wall OSS | マーカーレス6DoF AR | Soda3DART</title>

    <!-- 8-Frame (8th Wall用に調整されたA-Frame) -->
    <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>

    <!-- XR Extras (ロード画面・エラーハンドリング・タップリセンタ等) -->
    <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

    <!-- アニメーション用 (GLB clip) -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <!-- 8th Wall Engine (セルフホスティング: libs/ に配置した xr.js) -->
    <script async src="./libs/xr.js" data-preload-chunks="slam"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        .instruction {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="instruction">地面をタップしてオブジェクトを配置</div>

    <!-- A-Frame Scene with xrweb (8th Wall SLAM / World Effects) -->
    <a-scene
        xrweb
        xrextras-loading
        xrextras-runtime-error
        xrextras-tap-recenter
        renderer="colorManagement: true; physicallyCorrectLights: true"
        background="color: #000">

        <a-camera position="0 1.6 0"></a-camera>

        <!-- 照明 -->
        <a-entity light="type: ambient; intensity: 0.6"></a-entity>
        <a-entity light="type: directional; intensity: 0.8; castShadow: true; position: 2 4 2" shadow="cast: true"></a-entity>

        <!-- 03のモデル (fox) -->
        <a-assets>
            <a-asset-item id="fox-motion" src="../03/fox._motion.glb"></a-asset-item>
            <a-asset-item id="fox-behind" src="../03/fox._bhindglb.glb"></a-asset-item>
        </a-assets>

        <!-- タップ配置は app.js の XR8.XrController.hitTest() で実行 -->

        <!-- 初期配置オブジェクト: 03のフォックス (実寸大・空間固定 = 6DoF) -->
        <a-entity id="base-object" position="0 0 -2" rotation="90 0 0" scale="0.3 0.3 0.3">
            <a-entity gltf-model="#fox-motion" rotation="240 180 0" position="0 0 0" scale="1 1 1"
                animation-mixer="clip: *; loop: repeat" shadow="cast: true; receive: true"></a-entity>
            <a-entity gltf-model="#fox-behind" rotation="240 180 0" position="0 0.2 0" scale="1 1 1"
                animation-mixer="clip: *; loop: repeat" shadow="cast: true; receive: true"></a-entity>
        </a-entity>

    </a-scene>

    <script src="./app.js"></script>
</body>
</html>
