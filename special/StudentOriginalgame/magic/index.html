<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="vite.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>React 3D Platformer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
      {
        "imports": {
          "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
          "react/": "https://esm.sh/react@^19.1.0/",
          "react": "https://esm.sh/react@^19.1.0",
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js"
        }
      }
    </script>
  <style>
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }

    @keyframes bounce-in {
      0% {
        opacity: 0;
        transform: scale(0.5) translateY(-100px);
      }

      60% {
        opacity: 1;
        transform: scale(1.1) translateY(0);
      }

      80% {
        transform: scale(0.95);
      }

      100% {
        transform: scale(1);
      }
    }

    .animate-bounce-in {
      animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes button-boing {
      from {
        opacity: 0;
        transform: scale(0.5) translateY(50px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-button-boing {
      opacity: 0;
      animation: button-boing 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(-3deg) scale(1.1);
      }

      50% {
        transform: rotate(3deg) scale(1.1);
      }
    }

    .hover-animate-wiggle:hover {
      opacity: 1;
      animation: wiggle 0.3s ease-in-out infinite;
    }

    @keyframes rotate-phone {
      0% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(90deg);
      }

      50% {
        transform: rotate(90deg);
      }

      75% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    .animate-rotate-phone {
      animation: rotate-phone 2s ease-in-out infinite;
    }

    .text-shadow-pop {
      text-shadow: 4px 4px 0 #000, 6px 6px 0 #000;
    }

    .animate-shine {
      background: linear-gradient(to right, #FBBF24 20%, #FFFBEB 40%, #FFFBEB 60%, #FBBF24 80%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shine 2.5s linear infinite;
    }

    .text-shadow-win {
      text-shadow: 4px 4px 0px #b45309;
    }

    .confetti-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 30;
    }

    .confetti-piece {
      position: absolute;
      top: -20px;
      opacity: 0;
      animation: confetti-fall linear infinite;
    }

    @keyframes confetti-fall {
      0% {
        transform: translateY(0) rotateZ(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(100vh) rotateZ(720deg);
        opacity: 0;
      }
    }

    .stage-card {
      transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
    }

    .stage-card:hover {
      transform: translateY(-8px) scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25), 0 8px 8px rgba(0, 0, 0, 0.22);
    }

    .stage-card.locked {
      filter: grayscale(1) brightness(0.7);
      cursor: not-allowed;
    }
  </style>

</head>

<body class="bg-black overflow-hidden fixed inset-0">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
