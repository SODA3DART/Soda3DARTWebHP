<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumayu 3Dシューティング - 崇城大学芸術学部美術学科 3Dアートコース</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
            color: #fff;
            overflow: hidden;
            font-family: 'Noto Sans JP', sans-serif;
        }

        header {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.9) 0%, rgba(30, 10, 60, 0.9) 100%);
            box-shadow: 0 4px 20px rgba(66, 133, 244, 0.3);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, #4285f4, #34a853, #fbbc04);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text span {
            display: block;
            font-size: 14px;
            background: linear-gradient(90deg, #aaa, #fff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            transition: all 0.3s;
        }

        nav ul li a:hover {
            color: #4285f4;
            text-shadow: 0 0 10px rgba(66, 133, 244, 0.5);
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .game-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(66, 133, 244, 0.8);
            animation: title-pulse 2s ease-in-out infinite;
        }

        @keyframes title-pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        .game-subtitle {
            margin-top: 20px;
            font-size: 1.5rem;
            background: linear-gradient(90deg, #4285f4, #34a853, #fbbc04, #ea4335);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-flow 3s ease infinite;
        }

        @keyframes gradient-flow {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .start-button,
        .restart-button {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #4285f4, #34a853);
            color: #fff;
            padding: 20px 60px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 30px rgba(66, 133, 244, 0.6);
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .start-button:hover,
        .restart-button:hover {
            transform: translateX(-50%) scale(1.1);
        }

        .game-ui {
            display: none;
            position: fixed;
            top: 90px;
            left: 30px;
            color: white;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(66, 133, 244, 0.3);
        }

        .score-container {
            font-size: 32px;
            font-weight: bold;
        }

        .health-bar {
            margin-top: 10px;
            width: 200px;
            height: 20px;
            background: rgba(255, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #ffff00);
            transition: width 0.3s;
        }

        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.95);
            padding: 60px;
            border-radius: 30px;
            color: white;
            font-size: 48px;
            border: 3px solid rgba(255, 0, 0, 0.5);
        }

        .game-over div {
            margin: 30px 0;
        }

        .instructions {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
        }

        .debug-info {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
            max-width: 300px;
        }
    </style>
</head>

<body>
    <header>
        <div class="container header-container">
            <div class="logo">
                <div class="logo-text">崇城大学 芸術学部<span>3Dアートコース</span></div>
            </div>
            <nav>
                <ul>
                    <li><a href="../index.html">ホーム</a></li>
                    <li><a href="../gallery.html">ギャラリー</a></li>
                    <li><a href="../news_event.html">ニュース</a></li>
                    <li><a href="../question.html">よくある質問</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div id="game-container"></div>
    <div class="debug-info" id="debugInfo">読み込み中...</div>

    <div class="ui-overlay">
        <div class="game-title" id="gameTitle">
            <div>🐻 Kumayu 3Dシューティング 🎮</div>
            <div class="game-subtitle">崇城大学芸術学部美術学科 3Dアートコース</div>
        </div>
        <button class="start-button" id="startButton">🚀 ゲームスタート 🚀</button>
        <div class="instructions">
            <p>⌨️ WASDキーで移動 | スペースキーで射撃 🎯</p>
            <p>✨ 敵のビームを避けながら、全ての敵を倒そう！ ✨</p>
        </div>
        <div class="game-ui" id="gameUI">
            <div class="score-container">🏆 スコア: <span id="scoreDisplay">0</span></div>
            <div style="margin-top: 10px; font-size: 18px;">❤️ HP:</div>
            <div class="health-bar">
                <div class="health-fill" id="healthFill" style="width: 100%;"></div>
            </div>
        </div>
        <div class="game-over" id="gameOver">
            <div>💀 ゲームオーバー 💀</div>
            <div>🏆 最終スコア: <span id="finalScore">0</span></div>
            <button class="restart-button" id="restartButton">🔄 もう一度プレイ</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, player, playerModel;
        let enemies = [], bullets = [], enemyBullets = [], explosions = [];
        let clock, pointLights = [];
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let playerSpeed = 0.25, shootCooldown = 0.3, lastShootTime = 0;
        let score = 0, isGameOver = false, isGameActive = false, playerHealth = 100;

        function updateDebug(msg) {
            document.getElementById('debugInfo').innerHTML = msg;
            console.log('🔍', msg);
        }

        function init() {
            updateDebug('初期化開始...');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000011);
            scene.fog = new THREE.FogExp2(0x000033, 0.008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 12);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const colors = [0x4285f4, 0xff0066, 0x00ff88, 0xffaa00, 0xff00ff];
            for (let i = 0; i < 5; i++) {
                const light = new THREE.PointLight(colors[i], 2, 30);
                light.position.set((Math.random() - 0.5) * 40, 5 + Math.random() * 5, (Math.random() - 0.5) * 40);
                scene.add(light);
                pointLights.push(light);
            }

            const groundGeometry = new THREE.PlaneGeometry(80, 80);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x0a0a1a, metalness: 0.7, roughness: 0.3 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const gridHelper = new THREE.GridHelper(80, 80, 0x4285f4, 0x001133);
            gridHelper.material.opacity = 0.5;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            createStars();
            loadKumayuModel();
            createFloatingCubes();
            setupEventListeners();
            window.addEventListener('resize', onWindowResize);
            animateLights();

            updateDebug('初期化完了！Kumayuを読み込み中...');
        }

        function animateLights() {
            const time = Date.now() * 0.001;
            pointLights.forEach((light, i) => {
                light.intensity = 1.5 + Math.sin(time * (1 + i * 0.1)) * 0.5;
            });
            requestAnimationFrame(animateLights);
        }

        function loadKumayuModel() {
            updateDebug('Kumayu読み込み開始...');

            if (typeof THREE.GLTFLoader === 'undefined') {
                updateDebug('❌ GLTFLoader利用不可！デフォルトモデル使用');
                createDefaultPlayer();
                return;
            }

            const loader = new THREE.GLTFLoader();
            const modelPath = 'Models/Kumayu.glb';

            loader.load(
                modelPath,
                function (gltf) {
                    updateDebug('✅ Kumayu読み込み成功！');
                    playerModel = gltf.scene;
                    playerModel.scale.set(1.0, 1.0, 1.0);
                    playerModel.rotation.y = Math.PI;

                    playerModel.traverse(child => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    player = new THREE.Object3D();
                    player.add(playerModel);
                    player.position.set(0, 0, 10);
                    scene.add(player);

                    const glowGeometry = new THREE.SphereGeometry(1.5, 16, 16);
                    const glowMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.2 });
                    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                    player.add(glow);

                    updateDebug('🐻 Kumayu準備完了！');
                },
                (xhr) => {
                    const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                    updateDebug(`⏳ Kumayu読み込み中: ${percent}%`);
                },
                (error) => {
                    updateDebug(`❌ エラー: ${error.message}<br>デフォルトモデル使用`);
                    createDefaultPlayer();
                }
            );
        }

        function createDefaultPlayer() {
            const geometry = new THREE.ConeGeometry(0.5, 1.5, 4);
            const material = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00, emissiveIntensity: 1.5 });
            playerModel = new THREE.Mesh(geometry, material);
            playerModel.rotation.x = -Math.PI / 2;

            player = new THREE.Object3D();
            player.add(playerModel);
            player.position.set(0, 0.5, 10);
            scene.add(player);
            updateDebug('⚠️ デフォルトモデル使用中');
        }

        function createFloatingCubes() {
            for (let i = 0; i < 20; i++) {
                const size = Math.random() * 0.5 + 0.2;
                const geometry = new THREE.BoxGeometry(size, size, size);
                const material = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff, emissive: Math.random() * 0xffffff, emissiveIntensity: 0.5, transparent: true, opacity: 0.6 });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set((Math.random() - 0.5) * 60, Math.random() * 10 + 5, (Math.random() - 0.5) * 60);
                cube.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                cube.userData.rotationSpeed = { x: (Math.random() - 0.5) * 0.02, y: (Math.random() - 0.5) * 0.02, z: (Math.random() - 0.5) * 0.02 };
                scene.add(cube);
                cube.userData.isDecoration = true;
            }
        }

        function createEnemies() {
            enemies.forEach(enemy => scene.remove(enemy));
            enemies = [];

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 5; col++) {
                    const geometry = new THREE.OctahedronGeometry(0.7, 0);
                    const material = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2.5, metalness: 0.9, roughness: 0.1 });
                    const enemy = new THREE.Mesh(geometry, material);
                    enemy.position.x = (col - 2) * 5;
                    enemy.position.y = 1;
                    enemy.position.z = -10 - row * 5;
                    enemy.castShadow = true;
                    enemy.userData.rotationSpeed = Math.random() * 0.05 + 0.02;
                    enemy.userData.lastShootTime = Math.random() * 3;
                    enemy.userData.shootCooldown = 2 + Math.random() * 2;
                    scene.add(enemy);
                    enemies.push(enemy);
                }
            }
        }

        function createStars() {
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true, opacity: 0.8 });
            const starPositions = [];
            for (let i = 0; i < 2000; i++) {
                starPositions.push((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
            }
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }

        function enemyShoot(enemy) {
            if (!player) return;
            const geometry = new THREE.SphereGeometry(0.2, 8, 8);
            const material = new THREE.MeshBasicMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2 });
            const bullet = new THREE.Mesh(geometry, material);
            bullet.position.copy(enemy.position);
            const direction = new THREE.Vector3();
            direction.subVectors(player.position, enemy.position).normalize();
            bullet.userData.velocity = direction.multiplyScalar(0.3);
            scene.add(bullet);
            enemyBullets.push(bullet);
        }

        function createExplosion(position) {
            const particleCount = 30;
            const geometry = new THREE.BufferGeometry();
            const positions = [], colors = [], velocities = [];
            for (let i = 0; i < particleCount; i++) {
                positions.push(position.x, position.y, position.z);
                const color = new THREE.Color();
                color.setHSL(Math.random() * 0.1, 1, 0.5);
                colors.push(color.r, color.g, color.b);
                velocities.push({ x: (Math.random() - 0.5) * 0.3, y: (Math.random() - 0.5) * 0.3, z: (Math.random() - 0.5) * 0.3 });
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            const material = new THREE.PointsMaterial({ size: 0.5, transparent: true, opacity: 1, vertexColors: true, blending: THREE.AdditiveBlending });
            const explosion = new THREE.Points(geometry, material);
            explosion.userData.velocities = velocities;
            explosion.userData.life = 1.0;
            scene.add(explosion);
            explosions.push(explosion);
        }

        function updateExplosions() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const explosion = explosions[i];
                explosion.userData.life -= 0.02;
                if (explosion.userData.life <= 0) {
                    scene.remove(explosion);
                    explosions.splice(i, 1);
                    continue;
                }
                const positions = explosion.geometry.attributes.position.array;
                const velocities = explosion.userData.velocities;
                for (let j = 0; j < velocities.length; j++) {
                    positions[j * 3] += velocities[j].x;
                    positions[j * 3 + 1] += velocities[j].y;
                    positions[j * 3 + 2] += velocities[j].z;
                }
                explosion.geometry.attributes.position.needsUpdate = true;
                explosion.material.opacity = explosion.userData.life;
            }
        }

        function setupEventListeners() {
            document.getElementById('startButton').addEventListener('click', startGame);
            document.getElementById('restartButton').addEventListener('click', resetGame);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': event.preventDefault(); if (isGameActive && !isGameOver) shoot(); break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function startGame() {
            document.getElementById('gameTitle').style.display = 'none';
            document.getElementById('startButton').style.display = 'none';
            document.querySelector('.instructions').style.display = 'none';
            document.getElementById('gameUI').style.display = 'block';
            isGameActive = true;
            score = 0;
            playerHealth = 100;
            document.getElementById('scoreDisplay').textContent = score;
            enemies.forEach(e => scene.remove(e));
            enemies = [];
            bullets.forEach(b => scene.remove(b));
            bullets = [];
            enemyBullets.forEach(b => scene.remove(b));
        }

        function gameOver() {
            isGameOver = true;
            isGameActive = false;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('finalScore').textContent = score;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            if (!isGameActive || isGameOver) return;
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (player) {
                if (moveForward) player.position.z -= playerSpeed;
                if (moveBackward) player.position.z += playerSpeed;
                if (moveLeft) player.position.x -= playerSpeed;
                if (moveRight) player.position.x += playerSpeed;
                player.position.x = Math.max(-25, Math.min(25, player.position.x));
                player.position.z = Math.max(-5, Math.min(15, player.position.z));
            }

            scene.children.forEach(child => {
                if (child.userData.isDecoration) {
                    child.rotation.x += child.userData.rotationSpeed.x;
                    child.rotation.y += child.userData.rotationSpeed.y;
                    child.rotation.z += child.userData.rotationSpeed.z;
                }
            });

            enemies.forEach(enemy => {
                enemy.rotation.y += enemy.userData.rotationSpeed;
                enemy.position.y = 1 + Math.sin(time * 2 + enemy.position.x) * 0.2;
                if (time - enemy.userData.lastShootTime > enemy.userData.shootCooldown) {
                    enemyShoot(enemy);
                    enemy.userData.lastShootTime = time;
                }
            });

            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.position.z -= 0.8;
                bullet.rotation.y += 0.2;
                if (bullet.position.z < -50) {
                    scene.remove(bullet);
                    bullets.splice(i, 1);
                    continue;
                }
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    const distance = bullet.position.distanceTo(enemy.position);
                    if (distance < 1.2) {
                        createExplosion(enemy.position);
                        scene.remove(enemy);
                        enemies.splice(j, 1);
                        scene.remove(bullet);
                        bullets.splice(i, 1);
                        score += 10;
                        document.getElementById('scoreDisplay').textContent = score;
                        break;
                    }
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                const bullet = enemyBullets[i];
                bullet.position.add(bullet.userData.velocity);
                if (bullet.position.z > 50 || bullet.position.x < -30 || bullet.position.x > 30) {
                    scene.remove(bullet);
                    enemyBullets.splice(i, 1);
                    continue;
                }
                if (player) {
                    const distance = bullet.position.distanceTo(player.position);
                    if (distance < 1.5) {
                        createExplosion(bullet.position);
                        scene.remove(bullet);
                        enemyBullets.splice(i, 1);
                        playerHealth -= 10;
                        document.getElementById('healthFill').style.width = playerHealth + '%';
                        if (playerHealth <= 0) gameOver();
                    }
                }
            }

            updateExplosions();

            if (enemies.length === 0 && isGameActive) {
                score += 100;
                document.getElementById('scoreDisplay').textContent = score;
                setTimeout(() => createEnemies(), 1000);
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>

</html>
