<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Summoning | Soda3DART</title>
    <!-- MindAR and A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #00f2ff;
            --secondary-color: #ff0055;
            --bg-glass: rgba(20, 20, 30, 0.6);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Loading Screen */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
            pointer-events: auto;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Scanning Overlay */
        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 70vw;
            max-width: 400px;
            max-height: 400px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            overflow: hidden;
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
            position: absolute;
            top: 0;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% {
                top: 0;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* Header */
        header {
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
            text-align: center;
            pointer-events: auto;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--primary-color);
        }

        /* Footer / Controls */
        footer {
            padding: 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            text-align: center;
            pointer-events: auto;
        }

        .status-pill {
            display: inline-block;
            padding: 8px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <p>Initializing AR System...</p>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <header>
            <h1>AR Summon</h1>
        </header>

        <div class="scan-frame">
            <div class="scan-line"></div>
        </div>

        <footer>
            <div id="status-text" class="status-pill">Point camera at marker</div>
        </footer>
    </div>

    <!-- AR Scene -->
    <!-- IMPORTANT: 'targets.mind' must be compiled and placed in the assets folder -->
    <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; uiLoading: no; uiError: no; uiScanning: no;"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets id="assets-container">
            <!-- Assets will be injected here -->
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Entities will be injected here -->
        <a-entity id="targets-container"></a-entity>

    </a-scene>

    <script>
        // CONFIGURATION
        // Define your models here. The index corresponds to the image index in the compiled .mind file.
        const AR_CONFIG = [
            {
                id: 'model-0',
                modelSrc: './Models/Kumayu.glb', // Example model
                scale: '0.5 0.5 0.5',
                position: '0 0 0',
                rotation: '0 0 0'
            },
            // Add more configurations as needed for subsequent markers (index 1, 2, etc.)
            // {
            //     id: 'model-1',
            //     modelSrc: './Models/AnotherModel.glb',
            //     scale: '0.5 0.5 0.5',
            //     position: '0 0 0',
            //     rotation: '0 0 0'
            // }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const scene = document.querySelector('a-scene');
            const assetsContainer = document.getElementById('assets-container');
            const targetsContainer = document.getElementById('targets-container');
            const loadingScreen = document.getElementById('loading-screen');
            const statusText = document.getElementById('status-text');

            // 1. Generate Assets and Entities dynamically
            AR_CONFIG.forEach((config, index) => {
                // Asset Item
                const assetItem = document.createElement('a-asset-item');
                assetItem.setAttribute('id', config.id + '-asset');
                assetItem.setAttribute('src', config.modelSrc);
                assetsContainer.appendChild(assetItem);

                // Target Entity
                const targetEntity = document.createElement('a-entity');
                targetEntity.setAttribute('mindar-image-target', `targetIndex: ${index}`);

                // Model Entity
                const modelEntity = document.createElement('a-gltf-model');
                modelEntity.setAttribute('rotation', config.rotation);
                modelEntity.setAttribute('position', config.position);
                modelEntity.setAttribute('scale', config.scale);
                modelEntity.setAttribute('src', `#${config.id}-asset`);

                // Animation (optional: simple float)
                modelEntity.setAttribute('animation', "property: position; to: 0 0.1 0; dir: alternate; dur: 2000; loop: true");

                // Events for UI feedback
                targetEntity.addEventListener('targetFound', () => {
                    statusText.textContent = `Target ${index + 1} Found!`;
                    statusText.style.borderColor = '#00f2ff';
                    statusText.style.color = '#00f2ff';
                });

                targetEntity.addEventListener('targetLost', () => {
                    statusText.textContent = 'Scanning for markers...';
                    statusText.style.borderColor = 'rgba(255,255,255,0.1)';
                    statusText.style.color = 'white';
                });

                targetEntity.appendChild(modelEntity);
                targetsContainer.appendChild(targetEntity);
            });

            // 2. Handle Loading State
            scene.addEventListener('loaded', () => {
                // A-Frame loaded
            });

            scene.addEventListener('arReady', () => {
                // MindAR ready
                loadingScreen.classList.add('hidden');
            });

            scene.addEventListener('arError', (event) => {
                statusText.textContent = 'Error initializing AR';
                console.error('AR Error:', event);
            });
        });
    </script>
</body>

</html>
