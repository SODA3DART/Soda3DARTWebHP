        // 現在の曜日・時間を取得

            const now = new Date();
            const day = now.getDay(); // 0=日曜, 1=月曜, ..., 6=土曜

            const dayNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
            const dayName = dayNames[day];
            
            if (day === 0 || day === 6) {
                return 'weekend';
            }
            
            const timeSlot = hour < 12 ? 'morning' : 'afternoon';
            return `${dayName}_${timeSlot}`;
        }

                    <div class="template-description">3Dアートコースで学べる内容について詳しく知りたい</div>
                </button>
            `;
            
            // グループAのボタン
            const groupAButton = `
                <button class="template-button" onclick="sendTemplateMessage('${selectedGroupA.message}')">
                    <div class="template-title">${selectedGroupA.title}</div>
                    <div class="template-description">${selectedGroupA.description}</div>
                </button>
            `;
            
            // グループBのボタン（利用可能な場合）
            let groupBButton = '';
            if (selectedGroupB) {
                groupBButton = `
                    <button class="template-button" onclick="sendTemplateMessage('${selectedGroupB.message}')">
                        <div class="template-title">${selectedGroupB.title}</div>
                        <div class="template-description">${selectedGroupB.description}</div>
                    </button>
                `;
            }
            
            return courseButton + groupAButton + groupBButton;
        }

        // テンプレートボタンの表示状態を管理
        function checkTemplateVisibility() {
            // 履歴がある場合はテンプレートボタンを非表示
            if (chatHistory.length > 0) {
                templateButtons.classList.add('hidden');
            } else {
                templateButtons.classList.remove('hidden');
                // テンプレートボタンを動的に生成
                templateButtons.innerHTML = generateTemplateButtons();
            }
        }

        // 履歴をlocalStorageから読み込み
        function loadHistory() {
            try {
                const savedHistory = localStorage.getItem('chat_history');
                if (savedHistory) {
                    const parsedHistory = JSON.parse(savedHistory);
                    // 古い形式から新しい形式に変換
                    chatHistory = parsedHistory.map(entry => {
                        if (entry.content) {
                            // 古い形式: { role: "user", content: "..." }
                            return { role: entry.role, parts: [{ text: entry.content }] };
                        } else if (entry.parts) {
                            // 新しい形式: { role: "user", parts: [{ text: "..." }] }
                            return entry;
                        }
                        return entry;
                    });
                    // 履歴がある場合は復元
                    restoreChatHistory();
                }
                
                // テンプレートボタンの表示状態をチェック
                checkTemplateVisibility();
            } catch (error) {
                console.error('履歴の読み込みに失敗しました:', error);
                chatHistory = [];
                checkTemplateVisibility();
            }
        }

        // チャット履歴を復元
        function restoreChatHistory() {
            chatHistory.forEach(entry => {
                if (entry.role === 'user' && entry.parts && entry.parts[0]) {
                    addMessage(entry.parts[0].text, 'user', false);
                } else if ((entry.role === 'model' || entry.role === 'assistant') && entry.parts && entry.parts[0]) {
                    addMessage(entry.parts[0].text, 'kumayu', false);
                }
            });
        }

        // 履歴をlocalStorageに保存
        function saveHistory() {
            try {
                localStorage.setItem('chat_history', JSON.stringify(chatHistory));
            } catch (error) {
                console.error('履歴の保存に失敗しました:', error);
            }
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            // 履歴を読み込み
            loadHistory();

            // テキストエリアの自動リサイズ
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            // Enterキーで送信（Shift+Enterで改行）
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // フォーム送信
            chatForm.addEventListener('submit', function(e) {
                e.preventDefault();
                sendMessage();
            });

            // リセットボタン
            resetButton.addEventListener('click', function() {
                if (confirm('チャット履歴をクリアしますか？この操作は取り消せません。')) {
                    clearHistory();
                }
            });
        });

        // 日付範囲の検証とファイル名生成
        function validateDateRange(dateRange) {
            const dateRegex = /^\d{4}-\d{2}-\d{2}$/;
            
            // 単一日付: 2025-10-18
            if (dateRegex.test(dateRange)) {
                return { valid: true, filename: `chat_logs_${dateRange}.zip` };
            }
            
            // その日以降: 2025-10-15~
            if (dateRange.endsWith('~') && dateRegex.test(dateRange.slice(0, -1))) {
                return { valid: true, filename: `chat_logs_${dateRange.slice(0, -1)}_onwards.zip` };
            }
            
            // その日以前: ~2025-10-17
            if (dateRange.startsWith('~') && dateRegex.test(dateRange.slice(1))) {
                return { valid: true, filename: `chat_logs_until_${dateRange.slice(1)}.zip` };
            }
            
            // 期間指定: 2025-10-15~2025-10-18
            const rangeMatch = dateRange.match(/^(\d{4}-\d{2}-\d{2})~(\d{4}-\d{2}-\d{2})$/);
            if (rangeMatch && dateRegex.test(rangeMatch[1]) && dateRegex.test(rangeMatch[2])) {
                return { valid: true, filename: `chat_logs_${rangeMatch[1]}_${rangeMatch[2]}.zip` };
            }
            
            return { valid: false, filename: null };
        }

        // 管理者用ログダウンロード機能
        async function downloadLogs(dateRange, password) {
            try {
                const response = await fetch('https://sodahpgeminiapi-abgzhhetd4cvf7dc.japanwest-01.azurewebsites.net/api/DownloadLogs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        date_range: dateRange,
                        password: password
                    })
                });

                if (response.status === 401) {
                    alert('パスワードが違います。');
                    return;
                }

                if (response.status === 404) {
                    addMessage('指定された期間にログは見つかりませんでした。', 'kumayu');
                    return;
                }

                if (!response.ok) {
                    alert('ログのダウンロードに失敗しました。');
                    return;
                }

                // ZIPファイルのダウンロード
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = validateDateRange(dateRange).filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

            } catch (error) {
                console.error('ダウンロードエラー:', error);
                alert('ログのダウンロードに失敗しました。');
            }
        }

        // メッセージ送信
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // 管理者コマンドの検知
            console.log('入力されたメッセージ:', message);
            if (message === '裏コード999を実行') {
                console.log('裏コード999コマンドが検知されました');
                // 旧形式のコマンド（期間指定対応）
                const password = prompt('管理者パスワードを入力してください:');
                if (password === null) return; // キャンセルされた場合

                const dateRange = prompt('ダウンロードしたいログの日付範囲を入力してください:\n例: 2025-10-18 (単一日付)\n例: 2025-10-15~ (その日以降)\n例: ~2025-10-17 (その日以前)\n例: 2025-10-15~2025-10-18 (期間指定)');
                if (dateRange === null) return; // キャンセルされた場合

                // 日付範囲の検証
                const validation = validateDateRange(dateRange);
                if (!validation.valid) {
                    alert('日付範囲の形式が正しくありません。\n例: 2025-10-18 (単一日付)\n例: 2025-10-15~ (その日以降)\n例: ~2025-10-17 (その日以前)\n例: 2025-10-15~2025-10-18 (期間指定)');
                    return;
                }

                // ダウンロード実行
                await downloadLogs(dateRange, password);
                return;
            } else if (message.startsWith('/download')) {
                // 新形式のコマンド（期間指定対応）
                const password = prompt('管理者パスワードを入力してください:');
                if (password === null) return; // キャンセルされた場合

                // /download の後の部分を取得
                const dateRangePart = message.substring('/download'.length).trim();
                
                if (!dateRangePart) {
                    alert('日付範囲を指定してください。\n例: /download 2025-10-18\n例: /download 2025-10-15~\n例: /download ~2025-10-17\n例: /download 2025-10-15~2025-10-18');
                    return;
                }

                // 日付範囲の検証
                const validation = validateDateRange(dateRangePart);
                if (!validation.valid) {
                    alert('日付範囲の形式が正しくありません。\n例: /download 2025-10-18\n例: /download 2025-10-15~\n例: /download ~2025-10-17\n例: /download 2025-10-15~2025-10-18');
                    return;
                }

                // ダウンロード実行
                await downloadLogs(dateRangePart, password);
                return;
            }

            // ユーザーメッセージを表示
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // 送信ボタンを無効化
            sendButton.disabled = true;

            // タイピングインジケーターを表示
            showTypingIndicator();

            try {
                // 現在の履歴を取得（最新の10件に制限）
                const currentHistory = chatHistory.slice(-10);

                // リクエストデータを準備（正しい形式）
                const requestData = {
                    message: message,
                    history: currentHistory
                };

                console.log('送信データ:', requestData);

                // Azure Functions APIにリクエスト
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });

                console.log('レスポンスステータス:', response.status);
                console.log('レスポンスヘッダー:', response.headers);

                if (!response.ok) {
                    // エラーレスポンスの詳細を取得
                    const errorText = await response.text();
                    console.error('エラーレスポンス:', errorText);
                    throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
                }

                // プレーンテキストとして応答を受け取る
                const reply = await response.text();
                console.log('受信した応答:', reply);
                
                // タイピングインジケーターを非表示
                hideTypingIndicator();

                // くまゆの返信を表示
                if (reply && reply.trim()) {
                    addMessage(reply, 'kumayu');
                    
                    // 履歴に追加（正しい形式）
                    chatHistory.push({ role: 'user', parts: [{ text: message }] });
                    chatHistory.push({ role: 'model', parts: [{ text: reply }] });
                    
                    // 履歴が長くなりすぎないように制限（最新の20件を保持）
                    if (chatHistory.length > 20) {
                        chatHistory = chatHistory.slice(-20);
                    }
                    
                    // 履歴を保存
                    saveHistory();
                    
                    // テンプレートボタンの表示状態を更新
                    checkTemplateVisibility();
                } else {
                    addMessage('申し訳ございませんモン…。うまく返答できませんでしたくま。もう一度お試しください。', 'kumayu');
                }

            } catch (error) {
                console.error('Error:', error);
                hideTypingIndicator();
                addMessage('申し訳ございませんモン…。システムに問題が発生したみたいだくま。しばらく時間をおいてから再度お試しください。', 'kumayu');
            } finally {
                // 送信ボタンを有効化
                sendButton.disabled = false;
            }
        }

        // URLをリンクに変換する関数
        function convertUrlsToLinks(text) {
            // URLの正規表現パターン（http/httpsで始まるURL）
            const urlPattern = /(https?:\/\/[^\s]+)/g;
            
            return text.replace(urlPattern, function(url) {
                // 角括弧で囲まれたURLの場合、角括弧を除去
                const cleanUrl = url.replace(/^\[|\]$/g, '');
                return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer" style="color: #667eea; text-decoration: underline;">${cleanUrl}</a>`;
            });
        }

        // メッセージ追加
        function addMessage(content, sender, animate = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const time = new Date().toLocaleTimeString('ja-JP', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });

            // 改行を<br>タグに変換し、URLをリンクに変換
            let formattedContent = content.replace(/\n/g, '<br>');
            formattedContent = convertUrlsToLinks(formattedContent);

            if (sender === 'user') {
                messageDiv.innerHTML = `
                    <div class="message-avatar">U</div>
                    <div class="message-content">
                        ${formattedContent}
                        <div class="message-time">${time}</div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <img src="../images/gallery/kumayuimage.webp" alt="くまゆ" class="message-avatar">
                    <div class="message-content">
                        ${formattedContent}
                        <div class="message-time">${time}</div>
                    </div>
                `;
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // タイピングインジケーター表示
        function showTypingIndicator() {
            typingIndicator.classList.add('show');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // タイピングインジケーター非表示
        function hideTypingIndicator() {
            typingIndicator.classList.remove('show');
        }

        // 履歴をクリアする関数
        function clearHistory() {
            chatHistory = [];
            localStorage.removeItem('chat_history');
            
            // チャットメッセージエリアをクリア
            chatMessages.innerHTML = `
                <div class="welcome-message">
                    <h3>こんにちは！くまゆです🐻</h3>
                    <p>崇城大学芸術学部美術学科3Dアートコースについて、何でもお気軽にお聞きください！<br>
                    コースの内容、施設、イベント、入試情報など、お答えできることはたくさんありますよ〜</p>
                </div>
                
                <!-- 初回ユーザー向けテンプレートボタン（動的生成） -->
                <div class="template-buttons" id="templateButtons">
                    <!-- テンプレートボタンはJavaScriptで動的に生成されます -->
                </div>
            `;
            
            // テンプレートボタンの表示状態を更新
            checkTemplateVisibility();
            
            // スクロールを最上部に
            chatMessages.scrollTop = 0;
        }

        // エラーハンドリング
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
        });

        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled promise rejection:', e.reason);
        });
    </script>
