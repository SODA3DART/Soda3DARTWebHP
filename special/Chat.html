<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta property="og:url" content="https://soda3dart.github.io/Soda3DARTWebHP/special/Chat.html">
    <meta property="og:title" content="くまゆチャット - 崇城大学芸術学部美術学科 3Dアートコース">
    <meta property="og:description" content="崇城大学芸術学部美術学科3Dアートコースのくまゆキャラクターとチャットできます。">
    <meta property="og:image" content="https://soda3dart.github.io/Soda3DARTWebHP/images/gallery/Kumayuiru.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://soda3dart.github.io/Soda3DARTWebHP/special/Chat.html">
    <meta property="twitter:title" content="くまゆチャット - 崇城大学芸術学部美術学科 3Dアートコース">
    <meta property="twitter:description" content="崇城大学芸術学部美術学科3Dアートコースのくまゆキャラクターとチャットできます。">
    <meta property="twitter:image" content="https://soda3dart.github.io/Soda3DARTWebHP/images/gallery/Kumayuiru.png">

    <!-- Font imports -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/earlyaccess/ipaexmincho.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans JP', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(78, 205, 196, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255, 193, 7, 0.05) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* ヘッダースタイル */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #333;
        }

        .logo img {
            height: 50px;
            margin-right: 15px;
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #667eea;
        }

        /* メインコンテンツ */
        main {
            margin-top: 100px;
            padding: 40px 0;
            min-height: calc(100vh - 200px);
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 70vh;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .kumayu-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid white;
            margin: 0 auto 15px;
            display: block;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .chat-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .chat-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: fadeInUp 0.3s ease;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }

        .message.kumayu .message-content {
            background: #f1f3f4;
            color: #333;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-top: 5px;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #f1f3f4;
            border-radius: 18px;
            max-width: 70px;
        }

        .typing-indicator.show {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 3px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .chat-input-container {
            padding: 20px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .chat-input-form {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 1rem;
            resize: none;
            min-height: 50px;
            max-height: 120px;
            transition: border-color 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .send-button:hover {
            transform: scale(1.05);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .welcome-message h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px 15px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #c62828;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* レスポンシブデザイン */
        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }

            .header-container {
                padding: 15px 0;
            }

            .nav-links {
                display: none;
            }

            .chat-container {
                height: 75vh;
                margin: 0 10px;
            }

            .chat-header {
                padding: 15px;
            }

            .kumayu-avatar {
                width: 60px;
                height: 60px;
            }

            .chat-title {
                font-size: 1.2rem;
            }

            .message-content {
                max-width: 85%;
            }

            .chat-input-container {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            main {
                margin-top: 80px;
                padding: 20px 0;
            }

            .chat-container {
                height: 80vh;
                border-radius: 15px;
            }

            .chat-messages {
                padding: 15px;
            }

            .message-content {
                max-width: 90%;
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-container">
                <a href="../index.html" class="logo">
                    <img src="../images/logohedder.webp" alt="崇城大学芸術学部美術学科3Dアートコース">
                    <span class="logo-text">3Dアートコース</span>
                </a>
                <nav>
                    <ul class="nav-links">
                        <li><a href="../index.html">ホーム</a></li>
                        <li><a href="../courseinfo.html">コース情報</a></li>
                        <li><a href="../gallery.html">ギャラリー</a></li>
                        <li><a href="../special/3DGallery.html">3Dギャラリー</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="chat-container" data-aos="fade-up">
                <div class="chat-header">
                    <img src="../images/gallery/Kumayuiru.png" alt="くまゆ" class="kumayu-avatar">
                    <h1 class="chat-title">くまゆチャット</h1>
                    <p class="chat-subtitle">崇城大学芸術学部美術学科3Dアートコースについて何でも聞いてね！</p>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-message">
                        <h3>こんにちは！くまゆです🐻</h3>
                        <p>崇城大学芸術学部美術学科3Dアートコースについて、何でもお気軽にお聞きください！<br>
                        コースの内容、施設、イベント、入試情報など、お答えできることはたくさんありますよ〜</p>
                    </div>
                </div>

                <div class="typing-indicator" id="typingIndicator">
                    <img src="../images/gallery/Kumayuiru.png" alt="くまゆ" class="message-avatar" style="width: 30px; height: 30px;">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <form class="chat-input-form" id="chatForm">
                        <textarea 
                            class="chat-input" 
                            id="messageInput" 
                            placeholder="メッセージを入力してください..."
                            rows="1"
                        ></textarea>
                        <button type="submit" class="send-button" id="sendButton">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // AOS初期化
        AOS.init({
            duration: 800,
            once: true
        });

        // Azure Functions API設定
        const API_URL = "https://sodahpgeminiapi-abgzhhetd4cvf7dc.japanwest-01.azurewebsites.net/api/SendMessage";

        // DOM要素
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const chatForm = document.getElementById('chatForm');
        const typingIndicator = document.getElementById('typingIndicator');


        // 会話履歴の管理
        let chatHistory = [];

        // 履歴をlocalStorageから読み込み
        function loadHistory() {
            try {
                const savedHistory = localStorage.getItem('chat_history');
                if (savedHistory) {
                    chatHistory = JSON.parse(savedHistory);
                    // 履歴がある場合は復元
                    restoreChatHistory();
                }
            } catch (error) {
                console.error('履歴の読み込みに失敗しました:', error);
                chatHistory = [];
            }
        }

        // チャット履歴を復元
        function restoreChatHistory() {
            chatHistory.forEach(entry => {
                if (entry.role === 'user') {
                    addMessage(entry.content, 'user', false);
                } else if (entry.role === 'assistant') {
                    addMessage(entry.content, 'kumayu', false);
                }
            });
        }

        // 履歴をlocalStorageに保存
        function saveHistory() {
            try {
                localStorage.setItem('chat_history', JSON.stringify(chatHistory));
            } catch (error) {
                console.error('履歴の保存に失敗しました:', error);
            }
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            // 履歴を読み込み
            loadHistory();

            // テキストエリアの自動リサイズ
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            // Enterキーで送信（Shift+Enterで改行）
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // フォーム送信
            chatForm.addEventListener('submit', function(e) {
                e.preventDefault();
                sendMessage();
            });
        });

        // メッセージ送信
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // ユーザーメッセージを表示
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // 送信ボタンを無効化
            sendButton.disabled = true;

            // タイピングインジケーターを表示
            showTypingIndicator();

            try {
                // 現在の履歴を取得
                const currentHistory = [...chatHistory];

                // Azure Functions APIにリクエスト
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        history: currentHistory,
                        message: message
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // プレーンテキストとして応答を受け取る
                const reply = await response.text();
                
                // タイピングインジケーターを非表示
                hideTypingIndicator();

                // くまゆの返信を表示
                if (reply && reply.trim()) {
                    addMessage(reply, 'kumayu');
                    
                    // 履歴に追加
                    chatHistory.push({ role: 'user', content: message });
                    chatHistory.push({ role: 'assistant', content: reply });
                    
                    // 履歴を保存
                    saveHistory();
                } else {
                    addMessage('申し訳ございませんモン…。うまく返答できませんでしたくま。もう一度お試しください。', 'kumayu');
                }

            } catch (error) {
                console.error('Error:', error);
                hideTypingIndicator();
                addMessage('申し訳ございませんモン…。システムに問題が発生したみたいだくま。しばらく時間をおいてから再度お試しください。', 'kumayu');
            } finally {
                // 送信ボタンを有効化
                sendButton.disabled = false;
            }
        }

        // メッセージ追加
        function addMessage(content, sender, animate = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const time = new Date().toLocaleTimeString('ja-JP', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });

            // 改行を<br>タグに変換
            const formattedContent = content.replace(/\n/g, '<br>');

            if (sender === 'user') {
                messageDiv.innerHTML = `
                    <div class="message-avatar">U</div>
                    <div class="message-content">
                        ${formattedContent}
                        <div class="message-time">${time}</div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <img src="../images/gallery/Kumayuiru.png" alt="くまゆ" class="message-avatar">
                    <div class="message-content">
                        ${formattedContent}
                        <div class="message-time">${time}</div>
                    </div>
                `;
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // タイピングインジケーター表示
        function showTypingIndicator() {
            typingIndicator.classList.add('show');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // タイピングインジケーター非表示
        function hideTypingIndicator() {
            typingIndicator.classList.remove('show');
        }

        // 履歴をクリアする関数（デバッグ用）
        function clearHistory() {
            chatHistory = [];
            localStorage.removeItem('chat_history');
            location.reload();
        }

        // エラーハンドリング
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
        });

        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled promise rejection:', e.reason);
        });
    </script>
</body>
</html>
