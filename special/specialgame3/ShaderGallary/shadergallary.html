<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLSL ART GALLERY | SODA 3D ART</title>
    <meta name="description" content="A collection of advanced GLSL shaders.">

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cinzel:wght@400;700&family=Noto+Sans+JP:wght@300;400&display=swap"
        rel="stylesheet">

    <!-- Three.js & Post Processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <!-- Import Map for Three.js modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <style>
        :root {
            --primary: #00ffff;
            --secondary: #ff00ff;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            background: radial-gradient(circle at center, transparent 0%, #000 150%);
            transition: opacity 0.5s;
        }

        header {
            text-align: center;
            pointer-events: auto;
            z-index: 20;
            mix-blend-mode: difference;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 10px;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--primary);
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Navigation / Gallery Interface */
        .gallery-nav {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            pointer-events: auto;
            z-index: 20;
        }

        .nav-dot {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-dot.active {
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transform: scale(1.5);
        }

        /* Info Panel */
        .info-panel {
            position: absolute;
            top: 50%;
            left: 50px;
            transform: translateY(-50%);
            width: 300px;
            padding: 30px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 4px;
            pointer-events: auto;
            transition: all 0.5s ease;
            opacity: 0;
            /* Hidden initially */
        }

        .info-panel.visible {
            opacity: 1;
            left: 80px;
        }

        .info-title {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .info-desc {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.9rem;
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .code-btn {
            display: inline-block;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .code-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary);
        }

        /* Code Overlay */
        .code-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: none;
            padding: 50px;
            overflow: auto;
        }

        .code-content {
            font-family: 'Fira Code', monospace;
            color: #0f0;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
        }

        .close-code {
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
        }

        /* Loading */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .loader-text {
            font-size: 2rem;
            letter-spacing: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
                text-shadow: 0 0 0 var(--primary);
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 20px var(--primary);
            }

            100% {
                opacity: 0.5;
                text-shadow: 0 0 0 var(--primary);
            }
        }

        .back-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.3s;
            pointer-events: auto;
            z-index: 30;
        }

        .back-btn:hover {
            opacity: 1;
            text-shadow: 0 0 10px #fff;
        }

        /* Gyro Button */
        #gyroButton {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border: 1px solid #fff;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font: normal 13px sans-serif;
            text-align: center;
            opacity: 0.5;
            outline: none;
            z-index: 999;
            cursor: pointer;
            display: none;
            /* Hidden by default */
        }

        #gyroButton:hover {
            opacity: 1;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                letter-spacing: 5px;
            }

            .subtitle {
                font-size: 0.8rem;
                letter-spacing: 2px;
            }

            .info-panel {
                width: 90%;
                left: 50%;
                transform: translate(-50%, -50%);
                padding: 20px;
            }

            .info-panel.visible {
                left: 50%;
            }

            .info-title {
                font-size: 1.2rem;
            }

            .info-desc {
                font-size: 0.8rem;
            }

            .ui-layer {
                padding: 20px;
            }

            .back-btn {
                top: 20px;
                right: 20px;
                font-size: 0.8rem;
            }

            .gallery-nav {
                bottom: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">
        <div class="loader-text">INITIALIZING ART CORE...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer" id="uiLayer">
        <header>
            <h1>GLSL GALLERY</h1>
            <div class="subtitle">Advanced Raymarching Collection</div>
        </header>

        <a href="../../../index.html" class="back-btn">EXIT GALLERY</a>

        <div class="info-panel" id="infoPanel">
            <h2 class="info-title" id="shaderTitle">Shader Name</h2>
            <p class="info-desc" id="shaderDesc">Description goes here.</p>
            <button class="code-btn" id="viewCodeBtn">VIEW SOURCE</button>
        </div>

        <div class="gallery-nav" id="navContainer">
            <!-- Dots generated by JS -->
        </div>
    </div>

    <button id="gyroButton">ENTER 360° MODE</button>

    <div class="code-overlay" id="codeOverlay">
        <div class="close-code" id="closeCode">&times;</div>
        <pre class="code-content" id="codeContent"></pre>
    </div>

    <script type="module">
        import { VRButton } from 'https://unpkg.com/three@0.128.0/examples/jsm/webxr/VRButton.js';
        import { DeviceOrientationControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/DeviceOrientationControls.js';

        // --- CONFIGURATION ---
        const CONFIG = {
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0.1
        };

        // --- SHADER DATA ---
        const SHADERS = [
            {
                id: 'fractal',
                title: 'FRACTAL COSMOS',
                desc: '無限に広がるマンデルボックス・フラクタル。数学的構造が織りなす宇宙。',
                fragment: `
                    uniform float uTime;
                    uniform vec2 uResolution;
                    uniform vec2 uMouse;
                    uniform bool uVRMode;
                    varying vec3 vWorldPosition;

                    #define MAX_STEPS 80
                    #define MAX_DIST 100.0
                    #define SURF_DIST 0.001

                    mat2 rot(float a) {
                        float s = sin(a), c = cos(a);
                        return mat2(c, -s, s, c);
                    }

                    float mandelbox(vec3 p) {
                        float scale = 2.8;
                        vec3 offset = p;
                        float dr = 1.0;
                        for (int i = 0; i < 10; i++) {
                            p.xy = clamp(p.xy, -1.0, 1.0) * 2.0 - p.xy;
                            float r2 = dot(p, p);
                            if (r2 < 0.5) { p *= 4.0; dr *= 4.0; } 
                            else if (r2 < 1.0) { p /= r2; dr /= r2; }
                            p = p * scale + offset;
                            dr = dr * scale + 1.0;
                        }
                        return length(p) / abs(dr);
                    }

                    float GetDist(vec3 p) {
                        p.xz *= rot(uTime * 0.1);
                        p.xy *= rot(uTime * 0.05);
                        return mandelbox(p);
                    }

                    float RayMarch(vec3 ro, vec3 rd) {
                        float dO = 0.0;
                        for(int i=0; i<MAX_STEPS; i++) {
                            vec3 p = ro + rd*dO;
                            float dS = GetDist(p);
                            dO += dS;
                            if(dO>MAX_DIST || dS<SURF_DIST) break;
                        }
                        return dO;
                    }

                    vec3 GetNormal(vec3 p) {
                        float d = GetDist(p);
                        vec2 e = vec2(0.001, 0);
                        vec3 n = d - vec3(GetDist(p-e.xyy), GetDist(p-e.yxy), GetDist(p-e.yyx));
                        return normalize(n);
                    }

                    void main() {
                        vec3 ro, rd;

                        if (uVRMode) {
                            ro = vec3(0.0, 0.0, 0.0); // VR/Gyro camera is at origin of skybox
                            rd = normalize(vWorldPosition);
                        } else {
                            vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                            ro = vec3(0, 0, -3.5);
                            rd = normalize(vec3(uv.x, uv.y, 1));
                        }

                        float d = RayMarch(ro, rd);
                        vec3 col = vec3(0);

                        if(d < MAX_DIST) {
                            vec3 p = ro + rd * d;
                            vec3 n = GetNormal(p);
                            vec3 lightPos = vec3(2, 4, -3);
                            float dif = clamp(dot(n, normalize(lightPos)), 0.0, 1.0);
                            col = vec3(dif);
                            col += 0.5 * sin(p * 2.0 + uTime);
                            col *= vec3(0.2, 0.8, 1.0);
                            float glow = 1.0 / (1.0 + d * d * 0.1);
                            col += glow * vec3(0.1, 0.3, 0.8);
                        } else {
                            col = vec3(0.05, 0.05, 0.1);
                        }

                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            },
            {
                id: 'liquid',
                title: 'LIQUID CHROME',
                desc: '流体金属のシミュレーション。環境マッピングによる反射表現。',
                fragment: `
                    uniform float uTime;
                    uniform vec2 uResolution;
                    uniform vec2 uMouse;
                    uniform bool uVRMode;
                    varying vec3 vWorldPosition;

                    #define MAX_STEPS 80
                    #define MAX_DIST 100.0
                    #define SURF_DIST 0.001

                    float hash(float n) { return fract(sin(n) * 43758.5453); }
                    float noise(vec3 x) {
                        vec3 p = floor(x);
                        vec3 f = fract(x);
                        f = f * f * (3.0 - 2.0 * f);
                        float n = p.x + p.y * 57.0 + 113.0 * p.z;
                        return mix(mix(mix(hash(n + 0.0), hash(n + 1.0), f.x),
                                       mix(hash(n + 57.0), hash(n + 58.0), f.x), f.y),
                                   mix(mix(hash(n + 113.0), hash(n + 114.0), f.x),
                                       mix(hash(n + 170.0), hash(n + 171.0), f.x), f.y), f.z);
                    }
                    float fbm(vec3 p) {
                        float f = 0.0;
                        f += 0.5000 * noise(p); p *= 2.02;
                        f += 0.2500 * noise(p); p *= 2.03;
                        f += 0.1250 * noise(p); p *= 2.01;
                        return f;
                    }

                    float GetDist(vec3 p) {
                        float displacement = fbm(p * 1.5 + uTime * 0.5);
                        return length(p) - 1.5 + displacement * 0.8;
                    }

                    float RayMarch(vec3 ro, vec3 rd) {
                        float dO = 0.0;
                        for(int i=0; i<MAX_STEPS; i++) {
                            vec3 p = ro + rd*dO;
                            float dS = GetDist(p);
                            dO += dS;
                            if(dO>MAX_DIST || dS<SURF_DIST) break;
                        }
                        return dO;
                    }

                    vec3 GetNormal(vec3 p) {
                        float d = GetDist(p);
                        vec2 e = vec2(0.01, 0);
                        vec3 n = d - vec3(GetDist(p-e.xyy), GetDist(p-e.yxy), GetDist(p-e.yyx));
                        return normalize(n);
                    }

                    void main() {
                        vec3 ro, rd;
                        if (uVRMode) {
                            ro = vec3(0.0, 0.0, 0.0);
                            rd = normalize(vWorldPosition);
                        } else {
                            vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                            ro = vec3(0, 0, -4);
                            rd = normalize(vec3(uv, 1));
                        }

                        float d = RayMarch(ro, rd);
                        vec3 col = vec3(0);

                        if(d < MAX_DIST) {
                            vec3 p = ro + rd * d;
                            vec3 n = GetNormal(p);
                            vec3 r = reflect(rd, n);
                            vec3 ref = vec3(0.5) + 0.5 * cos(r * 3.0 + vec3(0, 2, 4) + uTime);
                            float fresnel = pow(1.0 + dot(rd, n), 3.0);
                            col = ref * (0.2 + 0.8 * fresnel);
                            col += vec3(0.8, 0.9, 1.0) * pow(max(dot(r, vec3(0,1,0)), 0.0), 10.0);
                        }
                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            },
            {
                id: 'tunnel',
                title: 'NEON TUNNEL',
                desc: '無限に続く光の回廊。スピードと色彩の融合。',
                fragment: `
                    uniform float uTime;
                    uniform vec2 uResolution;
                    uniform bool uVRMode;
                    varying vec3 vWorldPosition;
                    
                    void main() {
                        vec3 rd;
                        if (uVRMode) {
                            rd = normalize(vWorldPosition);
                        } else {
                            vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                            rd = normalize(vec3(uv, 1.0)); // Simple projection
                        }

                        // Map rd to tunnel coordinates
                        // For tunnel, we need polar coords relative to view
                        // Let's approximate for VR: use rd.xy
                        
                        vec2 p = uVRMode ? rd.xy / (rd.z + 1.5) : (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                        
                        float r = length(p);
                        float a = atan(p.y, p.x);
                        float z = 1.0 / r + uTime * 2.0;
                        float angle = a / 3.14159 + uTime * 0.2;
                        float grid = abs(sin(z * 10.0) * sin(angle * 10.0));
                        
                        vec3 col = vec3(0);
                        col += vec3(0.1, 0.8, 1.0) / abs(sin(z * 10.0) * 2.0 + r * 5.0);
                        col += vec3(1.0, 0.2, 0.5) * grid * r;
                        col *= r * 1.5;
                        
                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            },
            {
                id: 'clouds',
                title: 'VOLUMETRIC CLOUDS',
                desc: 'レイマーチングによる雲の表現。夕暮れの空。',
                fragment: `
                    uniform float uTime;
                    uniform vec2 uResolution;
                    uniform bool uVRMode;
                    varying vec3 vWorldPosition;

                    float hash(float n) { return fract(sin(n)*753.5453123); }
                    float noise(in vec3 x) {
                        vec3 p = floor(x);
                        vec3 f = fract(x);
                        f = f*f*(3.0-2.0*f);
                        float n = p.x + p.y*157.0 + 113.0*p.z;
                        return mix(mix(mix( hash(n+  0.0), hash(n+  1.0),f.x),
                                       mix( hash(n+157.0), hash(n+158.0),f.x),f.y),
                                   mix(mix( hash(n+113.0), hash(n+114.0),f.x),
                                       mix( hash(n+270.0), hash(n+271.0),f.x),f.y),f.z);
                    }
                    float fbm(vec3 p) {
                        float f = 0.0;
                        f += 0.50000*noise( p ); p = p*2.02;
                        f += 0.25000*noise( p ); p = p*2.03;
                        f += 0.12500*noise( p ); p = p*2.01;
                        return f;
                    }

                    void main() {
                        vec3 ro, rd;
                        if (uVRMode) {
                            ro = vec3(0.0, 0.0, uTime * 2.0);
                            rd = normalize(vWorldPosition);
                        } else {
                            vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                            ro = vec3(0.0, 0.0, uTime * 2.0);
                            rd = normalize(vec3(uv, 1.0));
                        }
                        
                        vec3 col = vec3(0.5, 0.7, 0.9) - max(rd.y, 0.0)*0.5;
                        
                        float t = 0.0;
                        for(int i=0; i<64; i++) {
                            vec3 p = ro + t*rd;
                            float den = fbm(p * 0.5);
                            if(den > 0.4) {
                                float dif = clamp((den - fbm(p+0.3))/0.6, 0.0, 1.0);
                                vec3 lin = vec3(1.0, 0.6, 0.3)*dif + vec3(0.9);
                                col = mix(col, lin, 0.05 * den);
                            }
                            t += 0.2;
                        }
                        
                        float sun = pow(max(dot(rd, normalize(vec3(0, 0.2, 1))), 0.0), 32.0);
                        col += vec3(1.0, 0.8, 0.4) * sun;

                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            },
            {
                id: 'cyber',
                title: 'CYBER CITY',
                desc: 'グリッドとビル群。サイバーパンクな夜景。',
                fragment: `
                    uniform float uTime;
                    uniform vec2 uResolution;
                    uniform bool uVRMode;
                    varying vec3 vWorldPosition;

                    float sdBox(vec3 p, vec3 b) {
                        vec3 d = abs(p) - b;
                        return length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0);
                    }

                    float GetDist(vec3 p) {
                        float d = p.y + 1.0;
                        vec3 q = p;
                        q.xz = mod(p.xz + 5.0, 10.0) - 5.0;
                        float b = sdBox(q - vec3(0, 0, 0), vec3(1.0, 4.0 + sin(floor(p.x/10.0)*10.0)*2.0, 1.0));
                        return min(d, b);
                    }

                    float RayMarch(vec3 ro, vec3 rd) {
                        float dO = 0.0;
                        for(int i=0; i<100; i++) {
                            vec3 p = ro + rd*dO;
                            float dS = GetDist(p);
                            dO += dS;
                            if(dO>100.0 || dS<0.01) break;
                        }
                        return dO;
                    }

                    void main() {
                        vec3 ro, rd;
                        if (uVRMode) {
                            ro = vec3(0, 5, uTime * 5.0);
                            rd = normalize(vWorldPosition);
                        } else {
                            vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                            ro = vec3(0, 5, uTime * 5.0);
                            rd = normalize(vec3(uv.x, uv.y - 0.2, 1));
                        }

                        float d = RayMarch(ro, rd);
                        vec3 col = vec3(0);

                        if(d < 100.0) {
                            vec3 p = ro + rd * d;
                            if(p.y < -0.9) {
                                float grid = step(0.98, fract(p.x)) + step(0.98, fract(p.z));
                                col = vec3(0.0, 1.0, 1.0) * grid;
                            } else {
                                col = vec3(0.1, 0.0, 0.2);
                                float w = step(0.8, fract(p.y * 2.0)) * step(0.8, fract(p.x * 2.0));
                                col += vec3(1.0, 0.8, 0.0) * w;
                            }
                            col = mix(col, vec3(0.05, 0.0, 0.1), 1.0 - exp(-d * 0.02));
                        } else {
                            col = vec3(0.05, 0.0, 0.1);
                        }

                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            }
        ];

        // --- GLOBALS ---
        let scene, camera, renderer, composer;
        let currentShaderIndex = 0;
        let material;
        let quadMesh, skyboxMesh;
        let isVR = false;
        let isGyro = false;
        let controls; // DeviceOrientationControls

        // --- INIT ---
        function init() {
            // Scene Setup
            scene = new THREE.Scene();

            // Default Camera (2D)
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.xr.enabled = true; // Enable WebXR
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Add VR Button
            document.body.appendChild(VRButton.createButton(renderer));

            // Add Gyro Button Logic
            const gyroBtn = document.getElementById('gyroButton');
            // Check if mobile (simple check)
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                gyroBtn.style.display = 'block';
                gyroBtn.addEventListener('click', requestGyro);
            }

            // Post Processing (Bloom)
            const renderPass = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                CONFIG.bloomStrength,
                CONFIG.bloomRadius,
                CONFIG.bloomThreshold
            );

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            // --- GEOMETRY SETUP ---

            // 1. Full Screen Quad (for 2D Desktop)
            const quadGeo = new THREE.PlaneGeometry(2, 2);
            material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uMouse: { value: new THREE.Vector2(0, 0) },
                    uVRMode: { value: false }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vWorldPosition;
                    void main() {
                        vUv = uv;
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = vec4(position, 1.0);
                    }
                `,
                fragmentShader: SHADERS[0].fragment
            });
            quadMesh = new THREE.Mesh(quadGeo, material);
            scene.add(quadMesh);

            // 2. Skybox (for VR & Gyro)
            const boxGeo = new THREE.BoxGeometry(10, 10, 10);
            boxGeo.scale(-1, 1, 1); // Invert normals
            skyboxMesh = new THREE.Mesh(boxGeo, material);
            skyboxMesh.visible = false;
            scene.add(skyboxMesh);

            // Events
            window.addEventListener('resize', onResize);
            document.addEventListener('mousemove', onMouseMove);

            // VR Session Events
            renderer.xr.addEventListener('sessionstart', onVRStart);
            renderer.xr.addEventListener('sessionend', onVREnd);

            setupUI();

            // Start Animation Loop
            renderer.setAnimationLoop(animate);

            // Remove Loader
            setTimeout(() => {
                document.getElementById('loader').style.opacity = 0;
                setTimeout(() => document.getElementById('loader').style.display = 'none', 1000);
                document.getElementById('infoPanel').classList.add('visible');
            }, 1000);
        }

        // --- GYRO LOGIC ---
        function requestGyro() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            startGyroMode();
                        } else {
                            alert('Permission denied');
                        }
                    })
                    .catch(console.error);
            } else {
                // Non-iOS or older devices
                startGyroMode();
            }
        }

        function startGyroMode() {
            isGyro = true;
            document.getElementById('gyroButton').style.display = 'none';
            document.getElementById('uiLayer').style.display = 'none'; // Hide UI for immersion

            // Switch to Perspective Camera for Gyro
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0.1); // Slightly offset to avoid clipping if needed, but 0 is fine for skybox center

            controls = new DeviceOrientationControls(camera);

            quadMesh.visible = false;
            skyboxMesh.visible = true;
            material.uniforms.uVRMode.value = true; // Use same logic as VR
        }

        // --- VR LOGIC ---
        function onVRStart() {
            isVR = true;
            quadMesh.visible = false;
            skyboxMesh.visible = true;
            material.uniforms.uVRMode.value = true;
            document.getElementById('uiLayer').style.display = 'none';
        }

        function onVREnd() {
            isVR = false;
            quadMesh.visible = true;
            skyboxMesh.visible = false;
            material.uniforms.uVRMode.value = false;
            document.getElementById('uiLayer').style.display = 'flex';

            // Reset to Ortho Camera
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            composer.passes[0].camera = camera;
        }

        // --- UI LOGIC ---
        function setupUI() {
            const nav = document.getElementById('navContainer');
            SHADERS.forEach((shader, index) => {
                const dot = document.createElement('div');
                dot.className = `nav-dot ${index === 0 ? 'active' : ''}`;
                dot.onclick = () => switchShader(index);
                nav.appendChild(dot);
            });

            updateInfoPanel(0);

            document.getElementById('viewCodeBtn').onclick = () => {
                document.getElementById('codeContent').textContent = SHADERS[currentShaderIndex].fragment;
                document.getElementById('codeOverlay').style.display = 'block';
            };
            document.getElementById('closeCode').onclick = () => {
                document.getElementById('codeOverlay').style.display = 'none';
            };
        }

        function switchShader(index) {
            if (index === currentShaderIndex) return;
            currentShaderIndex = index;
            material.fragmentShader = SHADERS[index].fragment;
            material.needsUpdate = true;

            document.querySelectorAll('.nav-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
            updateInfoPanel(index);
        }

        function updateInfoPanel(index) {
            const shader = SHADERS[index];
            const title = document.getElementById('shaderTitle');
            const desc = document.getElementById('shaderDesc');

            gsap.to('#infoPanel', {
                opacity: 0, x: -20, duration: 0.3, onComplete: () => {
                    title.textContent = shader.title;
                    desc.textContent = shader.desc;
                    gsap.to('#infoPanel', { opacity: 1, x: 0, duration: 0.5 });
                }
            });
        }

        function onResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            renderer.setSize(width, height);
            composer.setSize(width, height);
            material.uniforms.uResolution.value.set(width, height);

            if (isGyro && camera.isPerspectiveCamera) {
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
            }
        }

        function onMouseMove(e) {
            material.uniforms.uMouse.value.set(
                e.clientX / window.innerWidth,
                1.0 - e.clientY / window.innerHeight
            );
        }

        function animate() {
            material.uniforms.uTime.value += 0.01;

            if (isVR) {
                renderer.render(scene, renderer.xr.getCamera());
            } else if (isGyro) {
                controls.update();
                // Render scene directly for Gyro (no bloom for performance/simplicity)
                renderer.render(scene, camera);
            } else {
                composer.render();
            }
        }

        init();
    </script>
</body>

</html>
