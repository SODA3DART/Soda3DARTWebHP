<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLSL ART GALLERY | SODA 3D ART</title>
    <meta name="description" content="A collection of advanced GLSL shaders.">

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cinzel:wght@400;700&family=Noto+Sans+JP:wght@300;400&display=swap"
        rel="stylesheet">

    <!-- Three.js & Post Processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <style>
        :root {
            --primary: #00ffff;
            --secondary: #ff00ff;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            background: radial-gradient(circle at center, transparent 0%, #000 150%);
        }

        header {
            text-align: center;
            pointer-events: auto;
            z-index: 20;
            mix-blend-mode: difference;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 10px;
            background: linear-gradient(to right, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--primary);
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Navigation / Gallery Interface */
        .gallery-nav {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            pointer-events: auto;
            z-index: 20;
        }

        .nav-dot {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-dot.active {
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transform: scale(1.5);
        }

        /* Info Panel */
        .info-panel {
            position: absolute;
            top: 50%;
            left: 50px;
            transform: translateY(-50%);
            width: 300px;
            padding: 30px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 4px;
            pointer-events: auto;
            transition: all 0.5s ease;
            opacity: 0;
            /* Hidden initially */
        }

        .info-panel.visible {
            opacity: 1;
            left: 80px;
        }

        .info-title {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .info-desc {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.9rem;
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .code-btn {
            display: inline-block;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        .code-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary);
        }

        /* Code Overlay */
        .code-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: none;
            padding: 50px;
            overflow: auto;
        }

        .code-content {
            font-family: 'Fira Code', monospace;
            color: #0f0;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
        }

        .close-code {
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
        }

        /* Loading */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }

        .loader-text {
            font-size: 2rem;
            letter-spacing: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
                text-shadow: 0 0 0 var(--primary);
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 20px var(--primary);
            }

            100% {
                opacity: 0.5;
                text-shadow: 0 0 0 var(--primary);
            }
        }

        .back-btn {
            position: fixed;
            top: 30px;
            right: 30px;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.3s;
            pointer-events: auto;
            z-index: 30;
        }

        .back-btn:hover {
            opacity: 1;
            text-shadow: 0 0 10px #fff;
        }
    </style>
</head>

<body>

    <div class="loader" id="loader">
        <div class="loader-text">INITIALIZING ART CORE...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header>
            <h1>GLSL GALLERY</h1>
            <div class="subtitle">Advanced Raymarching Collection</div>
        </header>

        <a href="../../../index.html" class="back-btn">EXIT GALLERY</a>

        <div class="info-panel" id="infoPanel">
            <h2 class="info-title" id="shaderTitle">Shader Name</h2>
            <p class="info-desc" id="shaderDesc">Description goes here.</p>
            <button class="code-btn" id="viewCodeBtn">VIEW SOURCE</button>
        </div>

        <div class="gallery-nav" id="navContainer">
            <!-- Dots generated by JS -->
        </div>
    </div>

    <div class="code-overlay" id="codeOverlay">
        <div class="close-code" id="closeCode">&times;</div>
        <pre class="code-content" id="codeContent"></pre>
    </div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0.1
        };

        // --- SHADER DATA ---
        const SHADERS = [
            {
                id: 'fractal',
                title: 'FRACTAL COSMOS',
                desc: '無限に広がるマンデルボックス・フラクタル。数学的構造が織りなす宇宙。',
                fragment: `
                    uniform float uTime;
                    uniform vec2 uResolution;
                    uniform vec2 uMouse;

                    #define MAX_STEPS 100
                    #define MAX_DIST 100.0
                    #define SURF_DIST 0.001

                    // Rotation matrix
                    mat2 rot(float a) {
                        float s = sin(a), c = cos(a);
                        return mat2(c, -s, s, c);
                    }

                    // Mandelbox Distance Estimator
                    float mandelbox(vec3 p) {
                        float scale = 2.8;
                        vec3 offset = p;
                        float dr = 1.0;
                        
                        for (int i = 0; i < 10; i++) {
                            p.xy = clamp(p.xy, -1.0, 1.0) * 2.0 - p.xy;
                            float r2 = dot(p, p);
                            if (r2 < 0.5) { 
                                p *= 4.0; 
                                dr *= 4.0; 
                            } else if (r2 < 1.0) { 
                                p /= r2; 
                                dr /= r2; 
                            }
                            p = p * scale + offset;
                            dr = dr * scale + 1.0;
                        }
                        return length(p) / abs(dr);
                    }

                    float GetDist(vec3 p) {
                        p.xz *= rot(uTime * 0.1);
                        p.xy *= rot(uTime * 0.05);
                        return mandelbox(p);
                    }

                    float RayMarch(vec3 ro, vec3 rd) {
                        float dO = 0.0;
                        for(int i=0; i<MAX_STEPS; i++) {
                            vec3 p = ro + rd*dO;
                            float dS = GetDist(p);
                            dO += dS;
                            if(dO>MAX_DIST || dS<SURF_DIST) break;
                        }
                        return dO;
                    }

                    vec3 GetNormal(vec3 p) {
                        float d = GetDist(p);
                        vec2 e = vec2(0.001, 0);
                        vec3 n = d - vec3(
                            GetDist(p-e.xyy),
                            GetDist(p-e.yxy),
                            GetDist(p-e.yyx));
                        return normalize(n);
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                        vec3 ro = vec3(0, 0, -3.5); // Camera position
                        vec3 rd = normalize(vec3(uv.x, uv.y, 1));

                        float d = RayMarch(ro, rd);
                        vec3 col = vec3(0);

                        if(d < MAX_DIST) {
                            vec3 p = ro + rd * d;
                            vec3 n = GetNormal(p);
                            vec3 r = reflect(rd, n);

                            // Lighting
                            vec3 lightPos = vec3(2, 4, -3);
                            float dif = clamp(dot(n, normalize(lightPos)), 0.0, 1.0);
                            
                            // Coloring based on position and normal
                            col = vec3(dif);
                            col += 0.5 * sin(p * 2.0 + uTime);
                            col *= vec3(0.2, 0.8, 1.0); // Cyan tint
                            
                            // Glow
                            float glow = 1.0 / (1.0 + d * d * 0.1);
                            col += glow * vec3(0.1, 0.3, 0.8);
                        } else {
                            // Background glow
                            col = vec3(0.05, 0.05, 0.1) * (1.0 - length(uv));
                        }

                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            },
            {
                id: 'liquid',
                title: 'LIQUID CHROME',
                desc: '流体金属のシミュレーション。環境マッピングによる反射表現。',
                fragment: `
                    uniform float uTime;
                    uniform vec2 uResolution;
                    uniform vec2 uMouse;

                    #define MAX_STEPS 100
                    #define MAX_DIST 100.0
                    #define SURF_DIST 0.001

                    // Noise functions
                    float hash(float n) { return fract(sin(n) * 43758.5453); }
                    float noise(vec3 x) {
                        vec3 p = floor(x);
                        vec3 f = fract(x);
                        f = f * f * (3.0 - 2.0 * f);
                        float n = p.x + p.y * 57.0 + 113.0 * p.z;
                        return mix(mix(mix(hash(n + 0.0), hash(n + 1.0), f.x),
                                       mix(hash(n + 57.0), hash(n + 58.0), f.x), f.y),
                                   mix(mix(hash(n + 113.0), hash(n + 114.0), f.x),
                                       mix(hash(n + 170.0), hash(n + 171.0), f.x), f.y), f.z);
                    }

                    float fbm(vec3 p) {
                        float f = 0.0;
                        f += 0.5000 * noise(p); p *= 2.02;
                        f += 0.2500 * noise(p); p *= 2.03;
                        f += 0.1250 * noise(p); p *= 2.01;
                        return f;
                    }

                    float GetDist(vec3 p) {
                        // Distort space with FBM
                        float displacement = fbm(p * 1.5 + uTime * 0.5);
                        return length(p) - 1.5 + displacement * 0.8;
                    }

                    float RayMarch(vec3 ro, vec3 rd) {
                        float dO = 0.0;
                        for(int i=0; i<MAX_STEPS; i++) {
                            vec3 p = ro + rd*dO;
                            float dS = GetDist(p);
                            dO += dS;
                            if(dO>MAX_DIST || dS<SURF_DIST) break;
                        }
                        return dO;
                    }

                    vec3 GetNormal(vec3 p) {
                        float d = GetDist(p);
                        vec2 e = vec2(0.01, 0);
                        vec3 n = d - vec3(
                            GetDist(p-e.xyy),
                            GetDist(p-e.yxy),
                            GetDist(p-e.yyx));
                        return normalize(n);
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                        vec3 ro = vec3(0, 0, -4);
                        vec3 rd = normalize(vec3(uv, 1));

                        float d = RayMarch(ro, rd);
                        vec3 col = vec3(0);

                        if(d < MAX_DIST) {
                            vec3 p = ro + rd * d;
                            vec3 n = GetNormal(p);
                            vec3 r = reflect(rd, n);

                            // Fake Environment Mapping
                            vec3 ref = vec3(0.5) + 0.5 * cos(r * 3.0 + vec3(0, 2, 4) + uTime);
                            
                            // Fresnel
                            float fresnel = pow(1.0 + dot(rd, n), 3.0);
                            
                            col = ref * (0.2 + 0.8 * fresnel);
                            col += vec3(0.8, 0.9, 1.0) * pow(max(dot(r, vec3(0,1,0)), 0.0), 10.0); // Specular
                        }

                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            },
            {
                id: 'tunnel',
                title: 'NEON TUNNEL',
                desc: '無限に続く光の回廊。スピードと色彩の融合。',
                fragment: `
                    uniform float uTime;
                    uniform vec2 uResolution;
                    
                    void main() {
                        vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                        
                        // Polar coordinates
                        float r = length(uv);
                        float a = atan(uv.y, uv.x);
                        
                        // Tunnel effect
                        float z = 1.0 / r + uTime * 2.0;
                        float angle = a / 3.14159 + uTime * 0.2;
                        
                        // Grid pattern
                        float grid = abs(sin(z * 10.0) * sin(angle * 10.0));
                        
                        // Color
                        vec3 col = vec3(0);
                        col += vec3(0.1, 0.8, 1.0) / abs(sin(z * 10.0) * 2.0 + r * 5.0); // Blue rings
                        col += vec3(1.0, 0.2, 0.5) * grid * r; // Pink grid
                        
                        // Fog
                        col *= r * 1.5;
                        
                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            },
            {
                id: 'clouds',
                title: 'VOLUMETRIC CLOUDS',
                desc: 'レイマーチングによる雲の表現。夕暮れの空。',
                fragment: `
                    uniform float uTime;
                    uniform vec2 uResolution;

                    // Simple noise
                    float hash(float n) { return fract(sin(n)*753.5453123); }
                    float noise(in vec3 x) {
                        vec3 p = floor(x);
                        vec3 f = fract(x);
                        f = f*f*(3.0-2.0*f);
                        float n = p.x + p.y*157.0 + 113.0*p.z;
                        return mix(mix(mix( hash(n+  0.0), hash(n+  1.0),f.x),
                                       mix( hash(n+157.0), hash(n+158.0),f.x),f.y),
                                   mix(mix( hash(n+113.0), hash(n+114.0),f.x),
                                       mix( hash(n+270.0), hash(n+271.0),f.x),f.y),f.z);
                    }

                    float fbm(vec3 p) {
                        float f = 0.0;
                        f += 0.50000*noise( p ); p = p*2.02;
                        f += 0.25000*noise( p ); p = p*2.03;
                        f += 0.12500*noise( p ); p = p*2.01;
                        return f;
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                        vec3 ro = vec3(0.0, 0.0, uTime * 2.0);
                        vec3 rd = normalize(vec3(uv, 1.0));
                        
                        vec3 col = vec3(0.5, 0.7, 0.9) - max(rd.y, 0.0)*0.5; // Sky gradient
                        
                        // Raymarch clouds
                        float t = 0.0;
                        for(int i=0; i<64; i++) {
                            vec3 p = ro + t*rd;
                            float den = fbm(p * 0.5);
                            if(den > 0.4) {
                                float dif = clamp((den - fbm(p+0.3))/0.6, 0.0, 1.0);
                                vec3 lin = vec3(1.0, 0.6, 0.3)*dif + vec3(0.9);
                                col = mix(col, lin, 0.05 * den); // Blend
                            }
                            t += 0.2;
                        }
                        
                        // Sun
                        float sun = pow(max(dot(rd, normalize(vec3(0, 0.2, 1))), 0.0), 32.0);
                        col += vec3(1.0, 0.8, 0.4) * sun;

                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            },
            {
                id: 'cyber',
                title: 'CYBER CITY',
                desc: 'グリッドとビル群。サイバーパンクな夜景。',
                fragment: `
                    uniform float uTime;
                    uniform vec2 uResolution;

                    float sdBox(vec3 p, vec3 b) {
                        vec3 d = abs(p) - b;
                        return length(max(d, 0.0)) + min(max(d.x, max(d.y, d.z)), 0.0);
                    }

                    float GetDist(vec3 p) {
                        // Ground
                        float d = p.y + 1.0;
                        
                        // Buildings (Repeated)
                        vec3 q = p;
                        q.xz = mod(p.xz + 5.0, 10.0) - 5.0;
                        float b = sdBox(q - vec3(0, 0, 0), vec3(1.0, 4.0 + sin(floor(p.x/10.0)*10.0)*2.0, 1.0));
                        
                        return min(d, b);
                    }

                    float RayMarch(vec3 ro, vec3 rd) {
                        float dO = 0.0;
                        for(int i=0; i<100; i++) {
                            vec3 p = ro + rd*dO;
                            float dS = GetDist(p);
                            dO += dS;
                            if(dO>100.0 || dS<0.01) break;
                        }
                        return dO;
                    }

                    void main() {
                        vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;
                        vec3 ro = vec3(0, 5, uTime * 5.0);
                        vec3 rd = normalize(vec3(uv.x, uv.y - 0.2, 1));

                        float d = RayMarch(ro, rd);
                        vec3 col = vec3(0);

                        if(d < 100.0) {
                            vec3 p = ro + rd * d;
                            
                            // Grid pattern on floor
                            if(p.y < -0.9) {
                                float grid = step(0.98, fract(p.x)) + step(0.98, fract(p.z));
                                col = vec3(0.0, 1.0, 1.0) * grid;
                            } else {
                                // Buildings
                                col = vec3(0.1, 0.0, 0.2);
                                // Windows
                                float w = step(0.8, fract(p.y * 2.0)) * step(0.8, fract(p.x * 2.0));
                                col += vec3(1.0, 0.8, 0.0) * w;
                            }
                            
                            // Fog
                            col = mix(col, vec3(0.05, 0.0, 0.1), 1.0 - exp(-d * 0.02));
                        } else {
                            // Sky
                            col = vec3(0.05, 0.0, 0.1);
                        }

                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            }
        ];

        // --- GLOBALS ---
        let scene, camera, renderer, composer;
        let currentShaderIndex = 0;
        let material;
        let mesh;

        // --- INIT ---
        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Post Processing
            const renderPass = new THREE.RenderPass(scene, camera);
            const bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                CONFIG.bloomStrength,
                CONFIG.bloomRadius,
                CONFIG.bloomThreshold
            );

            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloomPass);

            // Initial Shader Mesh (Full Screen Quad)
            const geometry = new THREE.PlaneGeometry(2, 2);
            material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    uMouse: { value: new THREE.Vector2(0, 0) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position, 1.0);
                    }
                `,
                fragmentShader: SHADERS[0].fragment
            });

            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // Events
            window.addEventListener('resize', onResize);
            document.addEventListener('mousemove', onMouseMove);

            setupUI();

            // Start Animation
            animate();

            // Remove Loader
            setTimeout(() => {
                document.getElementById('loader').style.opacity = 0;
                setTimeout(() => document.getElementById('loader').style.display = 'none', 1000);
                document.getElementById('infoPanel').classList.add('visible');
            }, 1000);
        }

        function setupUI() {
            const nav = document.getElementById('navContainer');
            SHADERS.forEach((shader, index) => {
                const dot = document.createElement('div');
                dot.className = `nav-dot ${index === 0 ? 'active' : ''}`;
                dot.onclick = () => switchShader(index);
                nav.appendChild(dot);
            });

            updateInfoPanel(0);

            // Code Overlay
            document.getElementById('viewCodeBtn').onclick = () => {
                document.getElementById('codeContent').textContent = SHADERS[currentShaderIndex].fragment;
                document.getElementById('codeOverlay').style.display = 'block';
            };
            document.getElementById('closeCode').onclick = () => {
                document.getElementById('codeOverlay').style.display = 'none';
            };
        }

        function switchShader(index) {
            if (index === currentShaderIndex) return;

            // Transition Effect
            currentShaderIndex = index;
            material.fragmentShader = SHADERS[index].fragment;
            material.needsUpdate = true;

            // Update UI
            document.querySelectorAll('.nav-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
            updateInfoPanel(index);
        }

        function updateInfoPanel(index) {
            const shader = SHADERS[index];
            const title = document.getElementById('shaderTitle');
            const desc = document.getElementById('shaderDesc');

            // GSAP Animation
            gsap.to('#infoPanel', {
                opacity: 0, x: -20, duration: 0.3, onComplete: () => {
                    title.textContent = shader.title;
                    desc.textContent = shader.desc;
                    gsap.to('#infoPanel', { opacity: 1, x: 0, duration: 0.5 });
                }
            });
        }

        function onResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(e) {
            material.uniforms.uMouse.value.set(
                e.clientX / window.innerWidth,
                1.0 - e.clientY / window.innerHeight
            );
        }

        function animate() {
            requestAnimationFrame(animate);
            material.uniforms.uTime.value += 0.01;
            composer.render();
        }

        init();
    </script>
</body>

</html>
